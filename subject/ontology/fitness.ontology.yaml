    PostRaceRecoveryReview, HardEasySequenceReview, ReadyToProgress, GoalProgressReview, and disabled
    CardiacDriftDetected. Their evidence gates and configurable thresholds live in x_coaching_knowledge
    in this ontology; DOSI does not execute these rules.
