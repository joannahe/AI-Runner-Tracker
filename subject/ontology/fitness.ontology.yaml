version: 0.2.0.dev0
name: FitnessGoalOntology
description: Reusable ontology for running, race, body-composition and sleep goals; separates observations,
  capability evidence, goal criteria, progress reviews and human-approved decisions.
ontology:
- concept: Athlete
  type: EntityType
  identify_by:
  - id
  description: 'Layer 1 Runner: a fictional athlete identity. Physiological estimates are time-stamped
    observations, not permanent properties on this person.'
  relationships:
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - Athlete id String.
- concept: TrainingSession
  type: EntityType
  identify_by:
  - athlete_id
  - id
  description: Layer 1 RunSession or other completed workout, deduplicated across source activities. A
    rest day belongs in PlannedAction, not here.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - TrainingSession athlete_id String.
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - TrainingSession id String.
  - name: date
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - TrainingSession date Date.
  - name: intent
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - TrainingSession intent String.
  - name: sport
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - TrainingSession sport String.
  - name: is_official_race
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - TrainingSession is_official_race Boolean.
  - name: race_format
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - TrainingSession race_format String.
  - name: performed_by
    description: An athlete performs a training session.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - An athlete performs a training session.
- concept: RaceEvent
  type: EntityType
  identify_by:
  - athlete_id
  - id
  description: A completed, verified race identified from an official TrainingSession. Race course distance
    must be verified separately; watch distance and HYROX format are not road-race distance.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - RaceEvent athlete_id String.
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - RaceEvent id String.
  - name: completed_on
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - RaceEvent completed_on Date.
  - name: course_distance_km
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - RaceEvent course_distance_km Decimal.
  - name: completed_as
    description: A verified race is a completed training session.
    roles:
    - concept: TrainingSession
    multiplicity: ManyToOne
    verbalizes:
    - A verified race is a completed training session.
- concept: SourceActivity
  type: EntityType
  identify_by:
  - id
  description: Layer 1 wearable source record; multiple records may describe the same completed session.
    COROS training_focus is a provider-generated primary session label, not time in a physiological zone.
  relationships:
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - SourceActivity id String.
  - name: distance_m
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - SourceActivity distance_m Decimal.
  - name: training_load
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - SourceActivity training_load Decimal.
  - name: training_focus
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - SourceActivity training_focus String.
  - name: records
    description: A source activity records a training session.
    roles:
    - concept: TrainingSession
    multiplicity: ManyToOne
    verbalizes:
    - A source activity records a training session.
- concept: RunningObservation
  type: EntityType
  identify_by:
  - athlete_id
  - analysis_revision
  - segment_ordinal
  - id
  description: Layer 1 Split or running leg at a particular analysis revision. A session may have several
    observations.
  relationships:
  - name: segment_ordinal
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - RunningObservation segment_ordinal Integer.
  - name: analysis_revision
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - RunningObservation analysis_revision Integer.
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - RunningObservation athlete_id String.
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - RunningObservation id String.
  - name: date
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - RunningObservation date Date.
  - name: measured_distance_m
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - RunningObservation measured_distance_m Decimal.
  - name: duration_s
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - RunningObservation duration_s Decimal.
  - name: heart_rate_bpm
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - RunningObservation heart_rate_bpm Decimal.
  - name: cadence_spm
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - RunningObservation cadence_spm Decimal.
  - name: part_of
    description: A running observation belongs to a training session.
    roles:
    - concept: TrainingSession
    multiplicity: ManyToOne
    verbalizes:
    - A running observation belongs to a training session.
- concept: SleepObservation
  type: EntityType
  identify_by:
  - athlete_id
  - source
  - id
  description: Layer 2 source sleep observation aligned to wake date, a recovery-context signal.
  relationships:
  - name: source
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - SleepObservation source String.
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - SleepObservation athlete_id String.
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - SleepObservation id String.
  - name: wake_date
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - SleepObservation wake_date Date.
  - name: sleep_minutes
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - SleepObservation sleep_minutes Integer.
  - name: score
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - SleepObservation score Integer.
  - name: observed_for
    description: A sleep observation belongs to an athlete.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - A sleep observation belongs to an athlete.
- concept: FitnessAssessment
  type: EntityType
  identify_by:
  - athlete_id
  - id
  description: Layer 2 provider estimate with observed time and metric code; its value does not become
    a permanent athlete property.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - FitnessAssessment athlete_id String.
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - FitnessAssessment id String.
  - name: metric_code
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - FitnessAssessment metric_code String.
  - name: value
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - FitnessAssessment value Decimal.
  - name: observed_at
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - FitnessAssessment observed_at Date.
  - name: assesses
    description: A fitness assessment describes an athlete.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - A fitness assessment describes an athlete.
  - name: unit
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - FitnessAssessment unit String.
  - name: source
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - FitnessAssessment source String.
  - name: time_quality
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - FitnessAssessment time_quality String.
- concept: GoalReviewWorkflow
  type: EntityType
  description: Layer 3 Agent procedure for reviewing any athlete goal. It has no warehouse row or automatic
    execution; its conceptual targets and uses_plan edges are explained in x_coaching_knowledge in this
    ontology.
  relationships:
  - name: targets
    description: A goal review workflow targets a goal.
    roles:
    - concept: Goal
    multiplicity: ManyToOne
    verbalizes:
    - A goal review workflow targets a goal.
  - name: uses_plan
    description: A goal review workflow uses a action plan.
    roles:
    - concept: ActionPlan
    multiplicity: ManyToOne
    verbalizes:
    - A goal review workflow uses a action plan.
- concept: DailyTrainingLoad
  type: EntityType
  identify_by:
  - athlete_id
  - source
  - id
  description: Layer 2 provider-estimated training stress from recent sessions. Short-term load, long-term
    load and source ratio help review possible exercise-related fatigue; they are not a direct fatigue
    measurement or a diagnosis.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - DailyTrainingLoad athlete_id String.
  - name: source
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - DailyTrainingLoad source String.
  - name: id
    roles:
    - concept: Date
    multiplicity: OneToOne
    verbalizes:
    - DailyTrainingLoad id Date.
  - name: short_term_load
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - DailyTrainingLoad short_term_load Decimal.
  - name: long_term_load
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - DailyTrainingLoad long_term_load Decimal.
  - name: load_ratio
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - DailyTrainingLoad load_ratio Decimal.
  - name: status
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - DailyTrainingLoad status String.
- concept: OvernightHRV
  type: EntityType
  identify_by:
  - athlete_id
  - source
  - id
  description: COROS official overnight HRV assessment at the sleep wake date. The personal normal range
    and provider evaluation are stored as observed; this is not a medical diagnosis.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - OvernightHRV athlete_id String.
  - name: source
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - OvernightHRV source String.
  - name: id
    roles:
    - concept: Date
    multiplicity: OneToOne
    verbalizes:
    - OvernightHRV id Date.
  - name: avg_ms
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - OvernightHRV avg_ms Decimal.
  - name: normal_low_ms
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - OvernightHRV normal_low_ms Decimal.
  - name: normal_high_ms
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - OvernightHRV normal_high_ms Decimal.
  - name: baseline_ms
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - OvernightHRV baseline_ms Decimal.
  - name: provider_evaluation
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - OvernightHRV provider_evaluation String.
  - name: observed_for
    description: An overnight HRV assessment belongs to an athlete.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - An overnight HRV assessment belongs to an athlete.
- concept: RestingHeartRate
  type: EntityType
  identify_by:
  - athlete_id
  - source
  - id
  description: Layer 2 resting heart-rate observation; compare with the same athlete and device baseline,
    not a fixed population threshold.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - RestingHeartRate athlete_id String.
  - name: source
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - RestingHeartRate source String.
  - name: id
    roles:
    - concept: Date
    multiplicity: OneToOne
    verbalizes:
    - RestingHeartRate id Date.
  - name: bpm
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - RestingHeartRate bpm Decimal.
  - name: status
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - RestingHeartRate status String.
- concept: HeartRateZone
  type: EntityType
  identify_by:
  - athlete_id
  - scheme_id
  - id
  description: Layer 2 athlete-specific heart-rate boundary with scheme version; not time spent in zone.
    The public fixture does not supply per-sample zone duration.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - HeartRateZone athlete_id String.
  - name: scheme_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - HeartRateZone scheme_id String.
  - name: id
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - HeartRateZone id Integer.
  - name: lower_bpm
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - HeartRateZone lower_bpm Decimal.
  - name: upper_bpm
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - HeartRateZone upper_bpm Decimal.
  - name: valid_from
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - HeartRateZone valid_from Date.
  - name: valid_to
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - HeartRateZone valid_to Date.
  - name: scheme_method
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - HeartRateZone scheme_method String.
  - name: assigned_to
    description: A heart-rate zone belongs to an athlete and a versioned zone scheme.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - A heart-rate zone belongs to an athlete and a versioned zone scheme.
- concept: Goal
  type: EntityType
  description: Versioned athlete-defined objective. A runner may have multiple concurrent goals; a revision
    does not overwrite an earlier version. Quantitative targets belong to GoalCriterion.
  relationships:
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - Goal id String.
  - name: kind
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - Goal kind String.
  - name: set_by
    description: An athlete sets a goal.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - An athlete sets a goal.
  - name: goal_type
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - Goal goal_type String.
  - name: status
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - Goal status String.
  - name: created_at
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - Goal created_at Date.
  - name: has_criterion
    description: A goal has one or more measurable or milestone criteria.
    roles:
    - concept: GoalCriterion
    verbalizes:
    - A goal has one or more measurable or milestone criteria.
    multiplicity: ManyToOne
  - name: version
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - Goal version Integer.
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - Goal athlete_id String.
  - name: title
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - Goal title String.
  identify_by:
  - athlete_id
  - id
  - version
- concept: ActionPlan
  type: EntityType
  description: Layer 1 goal-specific, human-reviewable plan. It can contain running workouts, sleep routines,
    or other planned actions; it is not a recorded outcome or automatic prescription.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - ActionPlan athlete_id String.
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - ActionPlan id String.
  - name: version
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - ActionPlan version Integer.
  - name: name
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - ActionPlan name String.
  - name: summary
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - ActionPlan summary String.
  - name: status
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - ActionPlan status String.
  - name: approval_status
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - ActionPlan approval_status String.
  - name: created_at
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - ActionPlan created_at Date.
  - name: approved_at
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - ActionPlan approved_at Date.
  - name: revision_reason
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - ActionPlan revision_reason String.
  - name: for_goal
    description: A plan version serves exactly one versioned athlete goal.
    roles:
    - concept: Goal
    multiplicity: ManyToOne
    verbalizes:
    - A plan version serves exactly one versioned athlete goal.
  - name: owned_by
    description: A plan version belongs to one athlete, whether draft or approved.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - A plan version belongs to one athlete, whether draft or approved.
  identify_by:
  - athlete_id
  - id
  - version
- concept: PlannedAction
  type: EntityType
  description: A proposed or approved action within one versioned plan. A candidate workout match is not
    completion; only a manually verified event may fulfill the action.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - PlannedAction athlete_id String.
  - name: plan_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - PlannedAction plan_id String.
  - name: plan_version
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - PlannedAction plan_version Integer.
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - PlannedAction id String.
  - name: scheduled_date
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - PlannedAction scheduled_date Date.
  - name: kind
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - PlannedAction kind String.
  - name: planned_intensity
    description: Proposed low, moderate or high intensity; requires a structured planned_action field
      before querying.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - Proposed low, moderate or high intensity; requires a structured planned_action field before querying.
  - name: title
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - PlannedAction title String.
  - name: target_duration_min
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - PlannedAction target_duration_min Integer.
  - name: planning_status
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - PlannedAction planning_status String.
  - name: completion_status
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - PlannedAction completion_status String.
  - name: candidate_event_id
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - PlannedAction candidate_event_id String.
  - name: verified_event_id
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - PlannedAction verified_event_id String.
  - name: match_method
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - PlannedAction match_method String.
  - name: match_reviewed_at
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - PlannedAction match_reviewed_at Date.
  - name: source
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - PlannedAction source String.
  - name: in_plan
    description: A planned action belongs to one versioned plan.
    roles:
    - concept: ActionPlan
    multiplicity: ManyToOne
    verbalizes:
    - A planned action belongs to one versioned plan.
  - name: fulfilled_by
    description: Only a reviewed, verified workout may fulfill a planned action.
    roles:
    - concept: TrainingSession
    multiplicity: ManyToOne
    verbalizes:
    - Only a reviewed, verified workout may fulfill a planned action.
  identify_by:
  - athlete_id
  - plan_id
  - plan_version
  - id
- concept: Capability
  type: EntityType
  description: Dated assessment of one running-capability type, backed by cited observations. Status distinguishes
    a provider baseline, descriptive evidence and an observed outcome; no universal score is computed.
  relationships:
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - Capability id String.
  - name: kind
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - Capability kind String.
  - name: belongs_to
    description: A capability assessment concerns an athlete.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - A capability assessment concerns an athlete.
  - name: athlete_id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - Capability athlete_id String.
  - name: assessment_version
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - Capability assessment_version Integer.
  - name: review_date
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - Capability review_date Date.
  - name: status
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - Capability status String.
  - name: confidence
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - Capability confidence String.
  - name: method_version
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - Capability method_version String.
  - name: rationale
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - Capability rationale String.
  identify_by:
  - athlete_id
  - id
  - assessment_version
- concept: MetricEvidence
  type: EntityType
  description: One cited metric or versioned pace-zone boundary supporting a dated capability review.
    Source, comparability and observed value are retained; the semantic metric formula is unchanged.
  relationships:
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - MetricEvidence id String.
  - name: metric_name
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - MetricEvidence metric_name String.
  - name: evidence_kind
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - MetricEvidence evidence_kind String.
  - name: observed_on
    roles:
    - concept: Date
