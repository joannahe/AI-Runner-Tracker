</div><div class="chart-tooltip" id="chartTooltip" role="tooltip"></div><script>const DATA=/* __DATA__ */;const RULES=/* __RULES__ */;
const TEXT={en:{tabs:['Daily','Perf','Form','Recovery','Base'],title:'Running capability',subtitle:'Running, performance, form, recovery, and long-term capacity across the selected athlete’s data.',workspace:'WORKSPACE',local:'Local demo',fiction:'Fictional data · DuckDB',personal:'Local athlete data · DuckDB',personalSource:'Source: the bundled local fitness snapshot. All figures are filtered to the selected athlete. Rebuild this page after importing new athlete data.',athlete:'Athlete',switchNote:'Choose whose data to view',from:'From',to:'To',period:'Group by',week:'Week',month:'Month',insight:'INSIGHTS',all:'All available dates',empty:'No observations in this range',source:'Source: local DuckDB synthetic fixture. Numbers are recalculated from the selected athlete and date range. No personal workout data are included.',single:'One device estimate; no trend can be inferred.',days:'days',sessions:'sessions',run:'run',avg:'weighted average',official:'official net time',devices:'device estimate',snapshot:'single snapshot',labelDate:'Date',recorded:'Recorded',noGait:'Raw lap metadata contains ground-time and stride-height fields in some records; units and zero-value meaning are unverified, so they are not plotted.',gaitNote:'Stride length = speed ÷ cadence. Each run has one canonical lap here, so a box plot would not be meaningful.',paceRule:'Lower pace in sec/km means faster. Measured running pace is kept separate from HYROX rule-reference pace.',loadRule:'Daily load is a provider estimate; it is not summed with activity-level training load.',recoveryRule:'Sleep and resting HR are independent review context, not inputs to the COROS Recovery estimate.',foundationRule:'VO₂max and thresholds are device estimates. The observed date records when data were fetched, not when the device calculated them. One snapshot cannot show monthly change.',zoneRule:'Training-zone boundaries are reference settings, not time spent in zones.',noTrend:'More dated observations are needed for a reliable trend.'},zh:{tabs:['日常看板','表现与能力','跑姿与输出','恢复状态','长期基础能力'],title:'整体跑步能力',subtitle:'查看所选运动员的训练量、表现、跑姿、恢复和长期基础能力。',workspace:'工作区',local:'本地演示',fiction:'虚构数据 · DuckDB',personal:'本地运动员数据 · DuckDB',personalSource:'来源：本地运动数据快照。所有数字均按所选运动员筛选。导入新运动员数据后请重新生成页面。',athlete:'运动员',switchNote:'选择要查看的运动员',from:'开始日期',to:'结束日期',period:'时间粒度',week:'周',month:'月',insight:'洞察分析',all:'所有可用日期',empty:'所选范围内暂无记录',source:'来源：本地 DuckDB 虚构示例。数字按选定运动员和日期重新计算，不包含真实个人运动数据。',single:'只有一次设备估计，不能据此判断趋势。',days:'天',sessions:'次',run:'跑步',avg:'加权平均',official:'官方净成绩',devices:'设备估计',snapshot:'单次快照',labelDate:'日期',recorded:'记录时间',noGait:'部分圈段原始扩展字段含触地时间与跑步高度；单位和 0 值含义尚未验证，因此暂不绘图。',gaitNote:'步幅＝速度÷步频。此处每次跑步仅有一个有效圈段，不适合绘制箱线图。',paceRule:'秒/公里越小代表越快。实测跑步配速与 HYROX 规则参考配速分开。',loadRule:'每日负荷是设备估计，不与活动级训练负荷直接相加。',recoveryRule:'睡眠和静息心率是独立的恢复复核信息，并非 COROS Recovery 数值的输入。',foundationRule:'最大摄氧量和阈值为设备估计；读取日期不是设备计算日期。每项只有一次快照，不能计算月度变化。',zoneRule:'训练区间的边界仅供解释使用，不代表在各区间停留的时间。',noTrend:'需要更多不同时期的记录才能判断趋势。'}};

const own=arr=>arr.filter(x=>x.athlete_id===state.athlete),fmt=(v,d=1)=>v==null||!Number.isFinite(+v)?'—':Number(v).toFixed(d),dur=s=>s==null?'—':`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}`,raceTime=s=>s==null?'—':`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`,pace=s=>s==null||!Number.isFinite(+s)?'—':`${Math.floor(Math.round(s)/60)}:${String(Math.round(s)%60).padStart(2,'0')}/km`;

function chart(rows,key,kind='line',unit='',altKey){
  if(!rows.length)return `<div class="empty">${esc(t().empty)}</div>`;
  let vals=rows.flatMap(x=>[x[key],altKey?x[altKey]:null]).filter(x=>x!=null&&Number.isFinite(+x)).map(Number);

function daily(){
  let a=source('runs'),load=source('load'),d=state.dates[0],i=state.lang==='zh';
  let g=group(a,d.grain),trend=g.map(([label,r])=>({label,km:sum(r,'measured_distance_m')/1000,time:sum(r,'duration_s')/3600,sessions:new Set(r.map(x=>x.id)).size,days:new Set(r.map(x=>x.date)).size}));
  let end=new Date((d.end||todayISO())+'T12:00:00'),start=new Date(end),previousStart=new Date(end),previousEnd=new Date(end);
  if(d.grain==='month'){

  }else{start.setDate(end.getDate()-6);previousEnd=new Date(start);previousEnd.setDate(start.getDate()-1);previousStart=new Date(previousEnd);previousStart.setDate(previousEnd.getDate()-6)}

  let all=own(DATA.runs),current=all.filter(x=>x.date>=iso(start)&&x.date<=iso(end)),previous=all.filter(x=>x.date>=iso(previousStart)&&x.date<=iso(previousEnd));
  let values=r=>({km:sum(r,'measured_distance_m')/1000,time:sum(r,'duration_s'),sessions:new Set(r.map(x=>x.id)).size,days:new Set(r.map(x=>x.date)).size});
  let cur=values(current),prev=values(previous),delta=(key,unit,digits=1)=>{let diff=cur[key]-prev[key],sign=diff>0?'+':'',value=key==='time'?fmt(diff/60,0):fmt(diff,digits);return `${i?'环比':'vs previous period'} ${sign}${value} ${unit}`};
  let latest=load.at(-1),status=latest?.status||'—';

    `<div class="grid two">${card(i?'跑量与跑步时间':'Running volume and time',`${t().period}: ${d.grain==='week'?t().week:t().month}`,chart(trend,'km','bar','km')+`<div class="note">${i?'同周期跑步时间':'Running time in the same periods'}: ${trend.map(x=>fmt(x.time,1)).join(' · ')} h</div>`)}${card(i?'跑步次数与训练天数':'Sessions and training days',`${t().period}: ${d.grain==='week'?t().week:t().month}`,chart(trend,'sessions','bar',i?'次':'runs','days')+`<div class="legend"><span><i class="swatch"></i>${i?'次数':'Sessions'}</span><span><i class="swatch alt"></i>${i?'天数':'Days'}</span></div>`)}</div>`+

return insight(a.length?(i?`${summary?'跑步摘要':'有效圈段'} ${a.length} 条，平均步频 ${fmt(m,0)} spm；步频应结合配速和训练目的解读，没有统一的“最佳 180”。`:`${a.length} ${summary?'run summaries':'canonical laps'}, average cadence ${fmt(m,0)} spm. Read cadence together with pace and run purpose; there is no universal 180 target.`):t().empty)+`<div class="grid three">${stat(i?'圈段平均步频':'Lap cadence',`${fmt(m,0)} <small>spm</small>`)}${stat(i?'圈段平均功率':'Lap power',`${fmt(mean(a.filter(x=>x.power>0),'power'),0)} <small>W</small>`)}${stat(i?'推算步幅':'Estimated step length',`${fmt(mean(a.map(x=>({stride:stride(x)})).filter(x=>x.stride>0),'stride'),2)} <small>m/step</small>`)}</div><div class="grid two">${card(i?'逐次步频':'Cadence by run',(summary?(i?'每次跑步摘要；暂无圈段分布。':'Per-run summaries; lap distributions are unavailable.'):multi?(i?'最近 12 次跑步的有效圈段分布。':'Canonical-lap distribution for the latest 12 runs.'):t().gaitNote),multi?boxChart(a,'cadence','spm'):chart(bars,'cadence','bar','spm'))}${card(i?'逐次功率':'Power by run',(summary?(i?'每次跑步摘要；暂无圈段分布。':'Per-run summaries; lap distributions are unavailable.'):multi?(i?'最近 12 次跑步的有效圈段分布。':'Canonical-lap distribution for the latest 12 runs.'):t().gaitNote),multi?boxChart(a,'power','W'):chart(bars,'power','bar','W'))}${card(i?'步幅（推算值）':'Estimated stride length',i?'速度÷步频；最近 12 次跑步的圈段分布。':'Speed divided by cadence; canonical-lap distribution for the latest 12 runs.',multi?boxChart(a,'stride','m/step'):chart(bars,'stride','bar','m/step'))}</div>${card(summary?(i?'逐次跑步摘要':'Run summaries'):(i?'圈段明细':'Canonical laps'),t().noGait+' '+(a.length>30?(i?`显示最近 30 条，共 ${a.length} 条。`:`Showing latest 30 of ${a.length} laps.`):''),table([t().labelDate,i?'步频':'Cadence',i?'功率':'Power',i?'配速':'Pace',i?'推算步幅':'Estimated step'],a.slice(-30).reverse().map(x=>[x.date,fmt(x.cadence,0)+' spm',x.power>0?fmt(x.power,0)+' W':'—',pace(x.pace),fmt(stride(x),2)+' m'])))}`}
function recovery(){let load=source('load'),sleep=source('sleep'),rhr=source('rhr'),rec=source('recovery'),latest=rec.at(-1),i=state.lang==='zh';return insight(latest?(i?`最近一次设备恢复度为 ${fmt(latest.pct,0)}%，记录于 ${latest.observed.slice(0,10)}。睡眠和静息心率单独用于复核；当前有 ${load.length} 天负荷数据；42 天基线仍不足。`:`Latest device recovery estimate is ${fmt(latest.pct,0)}% on ${latest.observed.slice(0,10)}. Sleep and resting HR provide separate context. ${load.length} daily load records are available; a 42-day baseline is still unavailable.`):(i?`暂无设备恢复度记录。当前有 ${load.length} 天负荷、${sleep.length} 天睡眠和 ${rhr.length} 天静息心率数据，可分别观察；不足以计算 42 天基线。`:`No device recovery estimate is available. There are ${load.length} load, ${sleep.length} sleep and ${rhr.length} resting-HR days to review separately; a 42-day baseline is unavailable.`))+`<div class="grid three">${stat(i?'恢复度':'Recovery estimate',latest?`${fmt(latest.pct,0)} <small>%</small>`:'—',t().single)}${stat(i?'主睡眠':'Main sleep',`${fmt(mean(sleep,'main_min')/60,1)} <small>h</small>`,i?'所选日期平均':'Selected-date average')}${stat(i?'静息心率':'Resting HR',`${fmt(mean(rhr,'bpm'),0)} <small>bpm</small>`,i?'所选日期平均':'Selected-date average')}</div><div class="grid two">${card(i?'短期与长期负荷':'Short & long-term load',t().loadRule,chart(load.map(x=>({label:x.date,short:x.short_load,long:x.long_load})),'short','line','points','long'))}${card(i?'主睡眠时长':'Main sleep duration',t().recoveryRule,chart(sleep.map(x=>({label:x.date,h:x.main_min/60})),'h','bar','h'))}</div><div class="grid two">${card(i?'静息心率':'Resting heart rate',t().recoveryRule,chart(rhr.map(x=>({label:x.date,bpm:x.bpm})),'bpm','line','bpm'))}${card(i?'负荷比':'Load ratio',t().loadRule,chart(load.map(x=>({label:x.date,ratio:x.ratio})),'ratio','line','ratio'))}</div><div class="note">${esc(t().recoveryRule)} ${esc(t().noTrend)}</div>`}
function foundation(){let f=source('fitness'),hr=source('hr_zones',false),pz=source('pace_zones',false),i=state.lang==='zh';let get=k=>f.find(x=>x.code===k),vo=get('vo2max_running'),th=get('threshold_hr_bpm'),tp=get('threshold_pace_s_per_km');return insight(f.length?(i?`最大摄氧量和阈值为设备估计的单次快照。读取日期并非设备计算日期，不能仅凭当前记录判断改善幅度。`:`VO₂max and threshold values are single device-estimated snapshots. Their observed dates are fetch times, and changes cannot be inferred from one reading.`):t().empty)+`<div class="grid three">${stat('VO₂max',`${fmt(vo?.value,0)} <small>ml/kg/min</small>`,t().devices)}${stat(i?'阈值心率':'Threshold HR',`${fmt(th?.value,0)} <small>bpm</small>`,t().devices)}${stat(i?'阈值配速':'Threshold pace',pace(tp?.value),t().devices)}</div><div class="grid two">${card(i?'心率区间':'Heart-rate zones',t().zoneRule,table([i?'区间':'Zone',i?'下限':'Lower',i?'上限（不含）':'Upper (exclusive)'],hr.map(x=>['Z'+x.zone,x.low==null?'—':x.low+' bpm',x.high==null?'—':x.high+' bpm'])))}${card(i?'配速区间':'Pace zones',t().zoneRule,table([i?'区间':'Zone',i?'较快边界':'Fast edge',i?'较慢边界':'Slow edge'],pz.map(x=>['Z'+x.zone,pace(x.fast),pace(x.slow)])))}</div><div class="note">${esc(t().foundationRule)}</div>`}
function todayISO(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function daysAgo(n){let d=new Date();d.setDate(d.getDate()-n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function monthsAgo(n){let d=new Date(),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function render(){
  document.documentElement.lang=state.lang;document.title=t().title+' · DOSI demo';
  $('title').textContent=t().title;$('subtitle').textContent=t().subtitle;
  let latest=own([...DATA.runs,...DATA.load,...DATA.sleep,...DATA.rhr,...(DATA.hrv||[])]).map(dateOf).filter(Boolean).sort().at(-1);
  $('stamp').textContent=(state.lang==='zh'?'数据更新至 ':'Data updated through ')+(latest||'—');
  $('languageZh').classList.toggle('active',state.lang==='zh');$('languageEn').classList.toggle('active',state.lang==='en');
  $('mobileNav').innerHTML=t().tabs.map((x,j)=>`<button type="button" class="nav ${j===state.tab?'active':''}" data-tab="${j}" aria-current="${j===state.tab?'page':'false'}">${esc(x)}</button>`).join('');
  $('athleteLabel').textContent=t().athlete;$('switchNote').textContent=t().switchNote;
  $('athlete').innerHTML=DATA.athletes.map((a,j)=>`<option value="${esc(a.athlete_id)}" ${a.athlete_id===state.athlete?'selected':''}>${esc(a.display_name||`${t().athlete} ${j+1} · ${a.athlete_id}`)}</option>`).join('');
  let d=state.dates[state.tab],gran=state.tab<2;
  let start=`<label>${t().from}<input class="control" id="start" type="date" value="${esc(d.start||'')}"></label>`;
  let end=`<label>${t().to}<input class="control" id="end" type="date" value="${esc(d.end||'')}"></label>`;
  let choices=gran?`<label>${t().period}<select class="control" id="grain"><option value="week" ${d.grain==='week'?'selected':''}>${t().week}</option><option value="month" ${d.grain==='month'?'selected':''}>${t().month}</option></select></label>`:'';
  let quick=(gran?[[84,state.lang==='zh'?'12 周':'12 weeks'],[42,state.lang==='zh'?'6 周':'6 weeks'],[28,state.lang==='zh'?'4 周':'4 weeks'],[112,state.lang==='zh'?'16 周':'16 weeks']]:[[30,state.lang==='zh'?'1 个月':'1 month'],[60,state.lang==='zh'?'2 个月':'2 months'],[180,state.lang==='zh'?'6 个月':'6 months']]);
  let shortcuts=`<div class="shortcuts">${quick.map(([days,label])=>`<button type="button" data-days="${days}">${label}</button>`).join('')}</div>`;
  $('filters').innerHTML=start+end+choices+shortcuts+`<span class="pill">${esc(DATA.meta.personal?t().personal:t().fiction)}</span>`;
  $('content').innerHTML=[daily,performance,gait,recovery,foundation,alerts][state.tab]();
  $('footer').textContent=DATA.meta.personal?t().personalSource:t().source;
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=+el.dataset.tab;render()});
  for(let k of ['start','end','grain']){let el=$(k);if(el)el.onchange=()=>{if(k==='grain')d.grain=el.value;else for(let j=0;j<6;j++)state.dates[j][k]=el.value;render()}}
  document.querySelectorAll('[data-days]').forEach(el=>el.onclick=()=>{let n=+el.dataset.days,from=gran?daysAgo(n):(n===30?monthsAgo(1):n===60?monthsAgo(2):monthsAgo(6));for(let j=0;j<6;j++){state.dates[j].start=from;state.dates[j].end=todayISO()}render()});
  document.querySelectorAll('[data-alert-filter]').forEach(el=>el.onclick=()=>{state.alertFilter=el.dataset.alertFilter;render()});
  document.querySelectorAll('[data-approve-action]').forEach(el=>el.onclick=()=>approveAction(el));
}
async function approveAction(el){
  const zh=state.lang==='zh',action=el.dataset.approveAction,rule=el.dataset.rule,date=el.dataset.date;
  if(!window.confirm(zh?`确认将 ${action} 请求交给本地 Agent？Agent 会重新核对证据与计划。`:`Send ${action} to your local Agent? It must recheck evidence and your plan.`))return;
  el.disabled=true;const status=el.closest('.alert-detail').querySelector('.action-status');
  try{
    const sessionResponse=await fetch('/api/action-session',{credentials:'same-origin'});
    if(!sessionResponse.ok)throw Error(zh?'请通过本地行动服务打开看板：http://127.0.0.1:8768/dashboard':'Open the dashboard through the local action service: http://127.0.0.1:8768/dashboard');
    const session=await sessionResponse.json();
    const response=await fetch('/api/approved-actions',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Action-Token':session.token},body:JSON.stringify({athlete_id:state.athlete,rule_code:rule,action_code:action,observation_date:date})});
    const result=await response.json();if(!response.ok)throw Error(result.error||'Request failed');
    status.textContent=zh?`已批准并送达本地 Agent 队列（${result.id}）；等待 Agent 核对并执行，计划尚未修改。`:`Approved and queued for the local Agent (${result.id}); awaiting verification and execution. Your plan has not changed.`;
    for(let attempt=0;attempt<120&&status.isConnected;attempt++){
      await new Promise(resolve=>setTimeout(resolve,5000));
      const check=await fetch('/api/approved-actions',{credentials:'same-origin'});if(!check.ok)break;
      const row=(await check.json()).actions.find(x=>x.id===result.id);
      if(row?.agent_result){const outcome=row.agent_result;
        status.textContent=outcome.status==='complete'?(zh?`Agent 已完成本地计划草案：${outcome.summary}（${outcome.plan_file}）`:`Agent created a local plan draft: ${outcome.summary} (${outcome.plan_file})`):(zh?`Agent 暂无法执行：${outcome.summary}`:`Agent could not complete this request: ${outcome.summary}`);
        break}
    }
  }catch(error){el.disabled=false;status.textContent=String(error.message||error)}
}
for(let j=0;j<6;j++)state.dates[j]={start:daysAgo(84),end:todayISO(),grain:'week'};
$('athlete').onchange=e=>{state.athlete=e.target.value;hideTooltip();render()};
$('languageZh').onclick=()=>{state.lang='zh';render()};$('languageEn').onclick=()=>{state.lang='en';render()};render();
const tooltip=$('chartTooltip');
function hideTooltip(){tooltip.style.display='none'}
function showTooltip(target,x,y){
  tooltip.textContent=target.dataset.tip;
  tooltip.style.display='block';
  let box=tooltip.getBoundingClientRect();
  tooltip.style.left=Math.max(8,Math.min(window.innerWidth-box.width-8,x+14))+'px';
  tooltip.style.top=Math.max(8,Math.min(window.innerHeight-box.height-8,y+14))+'px';
}
$('content').addEventListener('pointermove',event=>{
  let target=event.target.closest?.('.chart-hit');
  if(target)showTooltip(target,event.clientX,event.clientY);else hideTooltip();
});
$('content').addEventListener('pointerleave',hideTooltip);
$('content').addEventListener('focusin',event=>{
  let target=event.target.closest?.('.chart-hit');
  if(target){let box=target.getBoundingClientRect();showTooltip(target,box.right,box.top)}
});
$('content').addEventListener('focusout',hideTooltip);
$('content').addEventListener('pointerdown',event=>{
  let target=event.target.closest?.('.chart-hit');
  if(target){showTooltip(target,event.clientX,event.clientY);if(event.pointerType==='touch')setTimeout(hideTooltip,4000)}
});
</script></body></html>
