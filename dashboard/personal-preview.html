ates, and mark missing or incomplete evidence.","Evaluate biometric_fatigue_override and recovery_rules for completed local dates. Keep one-signal CompromisedRecovery separate from the two-distinct-signal composite fatigue review.","At the end of a completed week, evaluate training_progression_rules and polarized_intensity_distribution only when their stated coverage gates pass.","Review each active GoalCriterion and the next seven dated PlannedActions; distinguish an approved action from a proposed or already completed one.","Check configured race recovery windows and consecutive planned high-intensity sessions; require explicit intensity and recovery evidence before a pass or trigger.","Create a review event with rule code, observation window, values, baseline or provider range, effective threshold, rule version, source IDs, evidence sufficiency, and any affected planned action.","Notify the athlete only for a new actionable review event; explain the evidence and ask for approval before changing a plan.","Record the athlete's response and resulting plan version if the product later supports reminders and revisions."],"candidate_review_rules":["LoadRecoveryReview","ReadyToProgress","CompromisedRecovery","PossibleExerciseRelatedFatigueReview","OvertrainingRisk","WeeklyMileageIncreaseReview","PolarizedHighIntensityReview","GoalProgressReview","PostRaceRecoveryReview","HardEasySequenceReview"],"reminder_policy":{"requires_athlete_opt_in_and_channel":true,"deduplicate_by":["athlete_id","rule_code","observation_window_end","effective_rule_version","planned_action_id_if_any"],"no_repeated_message_without_new_evidence_or_material_plan_change":true,"insufficient_evidence":"State the missing coverage in the periodic review; do not emit a triggered-rule alert.","no_trigger":"Summarize observed trends without claiming the athlete is medically recovered or that a plan is safe.","proposed_change":"Draft only, tied to an exact goal and plan version; require athlete approval.","no_external_provider_write":true,"message_fields":["review_date","plain_language_finding","observed_value","personal_baseline_or_provider_range","threshold","source_dates","affected_plan_action","suggested_review","evidence_limit"]},"required_plan_checks":{"when":["after_a_completed_running_race_is_imported","before_presenting_a_new_plan_version","during_an_approved_plan_review","when_asked_about_training_spacing_or_post_race_readiness"],"resolve":["authorized_athlete","local_timezone","exact_action_plan_version","dated_planned_actions"],"rules":["PostRaceRecoveryReview","HardEasySequenceReview"],"race_evidence":["completed_running_race","canonical_watch_distance_km_or_known_race_format","effective_athlete_recovery_setting"],"sequencing_evidence":["structured_planned_intensity","explicit_easy_or_rest_actions","intervening_date_coverage"],"output":["rule_code","affected_action","dates","plan_version","evidence_status","configured_value","source_ids","proposed_draft_if_triggered"],"missing_input":"Return insufficient_evidence or unknown with the specific missing item; do not assume an empty day was rest or that a missing watch distance is zero.","approval":"Never edit an approved plan or external wearable schedule without athlete approval."}},"goal_review_workflow":{"concept":"GoalReview","persistence":"save_each_execution","interpretation":"Agent procedure with saved review, findings and proposals; the ontology does not automatically execute it or approve plan changes.","steps":[{"name":"resolve_goal","read_concepts":["Athlete","Goal","GoalCriterion"],"check":"Select the athlete and exact goal version, then filter GoalCriterion by athlete_id, goal_id and goal_version. The Goal.has_criterion arrow is conceptual; use the queryable GoalCriterion.belongs_to relation or the versioned criterion keys. Retain concurrent goals separately."},{"name":"review_progress","read_concepts":["GoalProgressAssessment","GoalProgressEvidence"],"check":"Read the latest applicable criterion-specific review and filter GoalProgressEvidence by athlete_id, assessment_id and assessment_version. The assessment's supported_by arrow is conceptual; use the queryable GoalProgressEvidence.supports relation. Retain cited source records, time window, units, status and method version. Insufficient evidence stays insufficient."},{"name":"review_context","read_concepts":["Capability","MetricEvidence","RecoveryState","RecoveryEvidence"],"check":"Treat capability and recovery as context for a next step, not a substitute for the goal criterion result."},{"name":"inspect_plan","read_concepts":["ActionPlan","PlannedAction"],"check":"Select the plan linked to that goal version. Separate approved actions, proposals, verified completion and candidate event matches."},{"name":"propose_next_step","read_concepts":["InferredState","Recommendation"],"check":"Cite the review and supporting observations; require human review before changing a plan or treating a candidate as completed."}]},"capability_evidence":[{"capability":"running_pace_capacity","concept_refs":["PaceZone"],"dataset_refs":["running_pace_zone"],"metric_refs":[],"relation":"versioned_profile_may_support_running_capability_trend","confidence":"contextual","conditions":["same_athlete_and_zone_index","same_device_and_scheme_method","distinct_effective_dates","compare_both_zone_boundaries_in_seconds_per_kilometer","corroborate_with_comparable_running_observations"],"interpretation":"Lower pace seconds per kilometer means a faster boundary. A change across comparable dated profiles may reflect improved running capacity; it may also reflect recalibration or provider algorithm changes. One zone snapshot cannot establish improvement. This is not recovery evidence."},{"capability":"aerobic_capacity","concept_refs":["FitnessAssessment"],"context_concept_refs":["HeartRateZone","PaceZone"],"dataset_refs":["latest_fitness_measurement"],"metric_refs":["latest_vo2max_running"],"zone_context":["running_hr_zone","running_pace_zone"],"relation":"provider_estimates","confidence":"contextual","interpretation":"Device estimate; compare the same device over time and with actual performance, not with laboratory VO2max as if interchangeable."},{"capability":"aerobic_endurance","concept_refs":["RunningObservation"],"context_concept_refs":["HeartRateZone","PaceZone","DailyTrainingLoad"],"dataset_refs":["running_observation"],"metric_refs":["measured_pace_s_per_km","weighted_avg_hr_bpm"],"zone_context":["running_hr_zone","running_pace_zone"],"relation":"paired_metrics_may_indicate","confidence":"exploratory","conditions":["same_run_type","comparable_route_and_weather","compatible_timing_basis","multiple_sessions"],"interpretation":"Faster pace at similar heart rate, or lower heart rate at similar pace, may be a trend; activity averages cannot establish a controlled test."},{"capability":"threshold_endurance","concept_refs":["FitnessAssessment","RunningObservation"],"context_concept_refs":["HeartRateZone","PaceZone"],"dataset_refs":["latest_fitness_measurement","running_observation"],"metric_refs":["latest_threshold_pace_s_per_km","latest_threshold_hr_bpm"],"zone_context":["running_hr_zone","running_pace_zone"],"relation":"provider_estimates","confidence":"contextual","conditions":["same_test_protocol","source_and_retrieval_time_shown"],"interpretation":"Do not infer a threshold from an ordinary run's average heart rate."},{"capability":"running_mechanics","concept_refs":["RunningObservation","SourceActivity"],"dataset_refs":["running_observation","running_power_observation","running_lap"],"metric_refs":["weighted_avg_cadence_spm","avg_power_w","lap_avg_cadence_spm","lap_avg_power_w"],"relation":"describes_output_not_ability_score","confidence":"descriptive","conditions":["same_device_and_mode","comparable_pace_and_terrain"],"interpretation":"Higher cadence or power is not inherently better; these metrics alone do not measure running economy."},{"capability":"race_performance","concept_refs":["TrainingSession"],"dataset_refs":["workout_event"],"metric_refs":["official_10k_net_time_s"],"relation":"validates_outcome","confidence":"observed","conditions":["official_race","same_distance_and_clock_basis"],"interpretation":"Race time reflects several abilities and race conditions; keep official and watch times separate."}],"training_exposure":{"metric_refs":["measured_run_distance_km","identified_run_time_s","run_session_count","run_day_count","coros_training_load"],"interpretation":"These describe training performed or device-estimated load, not a physiological ability. Filter standalone runs when answering a pure running question; do not add load scores across brands."},"recovery_context":{"dataset_refs":["daily_training_load","daily_sleep","daily_resting_hr","recovery_observation"],"metric_refs":["avg_short_term_load","avg_long_term_load","avg_load_ratio","avg_main_sleep_minutes","avg_sleep_score","avg_resting_hr_bpm","current_recovery_pct"],"interpretation":"These inform readiness to train and how to interpret an ability trend; they are not direct measures of aerobic capacity, endurance or running mechanics. COROS short/long load and source ratio are preserved as given; do not rename them ACWR or infer a fixed 7/28-day formula. Recovery percentage currently has only one observation and cannot form a history.","fatigue_proxy":"Use device-estimated daily short-term load, long-term load, source ratio and provider status as evidence of recent exercise stress; use the time-stamped COROS recovery estimate as a separate provider estimate. Sleep and resting heart rate are independent context, not inputs claimed to be in the COROS recovery formula. Do not infer all bodily fatigue or diagnose overreaching from load alone."},"inference_state_policy":{"persistence":"none","execution":"agent_review_only","interpretation":"Review flags are possible interpretations of cited observations, not measured values, diagnoses, or saved athlete states.","reuse_saved_assessments":"Read GoalProgressAssessment and RecoveryState instead of duplicating their stored conclusions as new state rows.","missing_evidence":"Do not emit a state when its listed evidence gate is unmet; keep disabled codes disabled."},"rule_thresholds":{"configuration":"Agent-facing defaults. An athlete-specific override may replace the default for that athlete; record the override value, effective date, and rule version with each review. This catalog does not store overrides or execute rules.","athlete_overrides":[],"defaults":{"coros_load_ratio_high":1.5,"completed_week_distance_growth_fraction":0.1,"high_intensity_session_fraction":0.2,"resting_hr_above_7d_baseline_bpm":5,"sleep_score_below_42d_baseline_fraction":0.1,"low_load_ratio":0.8,"sleep_duration_change_fraction":0.1,"sleep_duration_drop_fraction":0.1,"resting_hr_rise_fraction":0.1,"resting_hr_week_change_fraction":0.1},"comparison":"Strictly greater than the configured threshold; equality does not trigger the review flag."},"recommendation_policy":{"persistence":"none","execution":"agent_suggestion_only","evidence":"Cite the relevant saved goal-progress or recovery review and its source observations. A missing or disabled inferred state cannot justify a recommendation.","human_decision":"The athlete decides whether to change a plan. A proposal does not approve or apply an ActionPlan or PlannedAction.","accepted_change":"If the athlete approves a change, record the resulting plan or action revision in the versioned plan model; this catalog does not store a separate acceptance event.","external_write":"Never write a proposed adjustment to COROS or another provider automatically."},"inference_states":[{"code":"LoadRecoveryReview","status":"review_only","evidence":["training_exposure","recovery_context"],"recommendation_options":["ScaleBackVolume","InsertRestDay"],"rule":"Review several days of device-estimated load together with available sleep, resting heart rate and running-performance trends; one load cutoff does not measure total bodily fatigue or diagnose overreaching. No subjective-feedback input is required."},{"code":"ReadyToProgress","status":"review_only","evidence":["training_exposure","recovery_context","aerobic_endurance"],"recommendation_options":["ProgressIntensity"],"rule":"Consider only after several stable weeks with adequate recovery evidence; a person approves any change."},{"code":"GoalProgressReview","status":"needs_goal_criterion_and_comparable_evidence","evidence":["goal_criterion","matching_semantic_metric_or_milestone","dated_source"],"recommendation_options":[],"rule":"Review each criterion using a matching metric, unit, period and comparator. Race-time gaps need same-distance results or labelled predictions; sleep goals use observed sleep metrics; training-consistency goals use run counts or days; body-composition goals remain unsupported until suitable measurements exist. Missing target or evidence yields insufficient_evidence, not a fabricated percentage."},{"code":"CardiacDriftDetected","status":"disabled_missing_sample_series","evidence":[],"recommendation_options":[],"rule":"Requires continuous, valid heart-rate and speed samples from a steady run; activity averages do not establish drift."},{"code":"PostRaceRecoveryReview","status":"review_only_requires_watch_distance_and_athlete_policy","evidence":["completed_running_race","canonical_watch_distance_km_or_known_race_format","approved_plan","planned_intensity","rule_version"],"recommendation_options":["InsertRestDay","ScaleBackVolume"],"rule":"Flag a proposed high-intensity action inside the athlete-configured post-race easy/rest window. Review an approved plan and propose a new draft; do not silently change or block the approved plan."},{"code":"HardEasySequenceReview","status":"review_only_requires_structured_plan_intensity","evidence":["dated_planned_actions","planned_intensity","explicit_easy_or_rest_action","rule_version"],"recommendation_options":["InsertRestDay"],"rule":"Flag consecutive planned high-intensity sessions with no explicit intervening easy run or rest day. A blank calendar day is unknown, not proof of rest."},{"code":"OverreachingRisk","status":"disabled_insufficient_evidence","evidence":[],"recommendation_options":[],"rule":"A load ratio alone must not be classified as overreaching or injury risk."},{"code":"OvertrainingRisk","status":"review_only","evidence":["high_recent_load"],"default_query_concept":"HighLoadDay","recommendation_options":["ScaleBackVolume"],"rule":"Name retained for the requested workflow. Only flag a COROS-provided daily load_ratio strictly above the athlete's configured threshold (default 1.5) as high-load stress needing review. This is not a diagnosis of overtraining syndrome, overreaching, or injury risk. Cite the ratio, local date, source, and rule version. HighLoadDay applies the default 1.5 only; evaluate any athlete-specific override separately. Suggest reducing upcoming volume for human review; do not modify a plan automatically."},{"code":"WeeklyMileageIncreaseReview","status":"review_only","evidence":["completed_week_distance_growth"],"default_query_concept":"HighMileageGrowthWeek","recommendation_options":["ScaleBackVolume"],"rule":"Query the standard Ossie HighMileageGrowthWeek derived subtype for the default 10 percent condition; the mapped weekly view requires two consecutive verified complete weeks and includes measured hybrid running segments. Apply user-specific threshold overrides by querying WeeklyRunningDistance.growth_ratio. Review the planned increase with the runner; this is not an injury-risk diagnosis or universal safe limit."},{"code":"PolarizedHighIntensityReview","status":"review_only_when_focus_coverage_complete","evidence":["coros_primary_training_focus_for_each_completed_run","complete_week_and_deduplicated_sessions"],"default_numerator_source_concept":"CorosHighFocusRunActivity","recommendation_options":["ReviewNextInterval"],"rule":"Follow polarized_intensity_distribution.weekly_review. Count the COROS primary focus of each unique completed run; if the high-label share is strictly above the configured 20% default, propose reviewing the next interval session. Do not infer time in zone or a physiological HighStrain state."},{"code":"CompromisedRecovery","status":"agent_review_only_no_automatic_evaluator","evidence":["resting_hr_above_personal_baseline_bpm","overnight_hrv_below_provider_normal_range_when_available","sleep_score_below_personal_42d_baseline"],"recommendation_options":["DraftActiveRecoveryOrRest"],"rule":"Follow biometric_fatigue_override. A valid signal prompts a dated recovery review; when an uncompleted key workout is scheduled for that day, propose an easier action in a new draft ActionPlan version and notify the athlete for approval. Do not change an approved plan or a COROS schedule automatically. This is not a diagnosis."},{"code":"PossibleExerciseRelatedFatigueReview","status":"review_only","evidence":["high_recent_load","sleep_drop_7d","resting_hr_rise_7d"],"recommendation_options":["ScaleBackVolume","InsertRestDay"],"rule":"Follow recovery_rules.composite_review: require at least two distinct available signals, report source dates and coverage, and ask the person to review the next training step. No diagnosis or automatic plan change."}],"not_currently_available":["per_sample_zone_time","cardiac_drift","stride_length_and_ground_contact_time_as_validated_metrics","automatic_plan_modification"],"goal_criteria_examples":[{"goal_type":"race","criterion":"finish_or_time","supported_metric_refs":["official_10k_net_time_s","official_finish_time_s"],"requirements":"Same-distance official result or labelled prediction for time-gap assessment; completion can use milestone review."},{"goal_type":"running_consistency","criterion":"sessions_or_days_per_week","supported_metric_refs":["run_session_count","run_day_count","measured_run_distance_km"],"requirements":"Define target, week boundaries and standalone-run filter."},{"goal_type":"sleep","criterion":"sleep_duration_or_quality_trend","supported_metric_refs":["avg_main_sleep_minutes","avg_daily_sleep_minutes","avg_sleep_score"],"requirements":"Define period, wake-date alignment and source-specific score interpretation."},{"goal_type":"body_composition","criterion":"body_mass_or_body_fat_trend","supported_metric_refs":[],"requirements":"Requires consented, dated body measurement data and appropriate semantic metrics; do not infer from training load or calories."}],"recovery_rules":{"status":"agent_review_rules_not_executable_ontology_reasoner","scope":"athlete and source; align sleep by wake_date and load/resting heart rate by local_date in the athlete timezone","provenance":"user_configured_thresholds_with_provider_context","baseline_policy":{"exclude_current_day":true,"short_window_days":7,"long_sleep_window_days":42,"proposed_min_valid_days_7":5,"proposed_min_valid_days_42":28,"missing_data":"insufficient_evidence"},"dashboard_signals":[{"code":"low_recent_load","label_en":"Low recent training load","label_zh":"近期训练负荷较低","default_query_concept":"LowLoadDay","action_en":"Review your goal, planned recovery, and recent consistency before increasing load.","action_zh":"结合目标、计划休息和近期训练连续性，决定是否需要逐步增加负荷。","source":"load","field":"ratio","comparison":"below","threshold":"low_load_ratio","baseline":"none"},{"code":"sleep_duration_42d_outlier","label_en":"Sleep duration differs from your longer baseline","label_zh":"睡眠时长偏离长期基线","action_en":"Check the direction and recent nights; longer sleep is not automatically poor sleep.","action_zh":"核对变化方向和近几晚情况；睡得更久不自动代表睡眠差。","source":"sleep","field":"main_min","comparison":"absolute_fraction_change_above","threshold":"sleep_duration_change_fraction","baseline":"prior_valid_days","baseline_days":42,"min_valid_days":28},{"code":"sleep_drop_7d","label_en":"Sleep duration is below your recent baseline","label_zh":"睡眠时长低于近期基线","action_en":"Review recent nights and the next key workout before proposing a lighter day.","action_zh":"结合近几晚睡眠与下一次重点训练，复核是否需要轻松日。","source":"sleep","field":"main_min","comparison":"fraction_below_baseline","threshold":"sleep_duration_drop_fraction","baseline":"prior_valid_days","baseline_days":7,"min_valid_days":5},{"code":"resting_hr_rise_7d","label_en":"Resting heart rate rose against your recent baseline","label_zh":"静息心率高于近期基线","action_en":"Compare sleep, load, and other context; do not attribute a rise to training alone.","action_zh":"结合睡眠、负荷等情况复核，不能只归因于训练。","source":"rhr","field":"bpm","comparison":"fraction_above_baseline","threshold":"resting_hr_rise_fraction","baseline":"prior_valid_days","baseline_days":7,"min_valid_days":5},{"code":"resting_hr_week_change","label_en":"Resting heart rate changed between weeks","label_zh":"静息心率周间变化","action_en":"Check whether the change is upward; a downward change is context, not a fatigue signal.","action_zh":"先看变化方向；下降是观察信息，不作为疲劳信号。","source":"rhr","field":"bpm","comparison":"consecutive_window_mean_change_above","threshold":"resting_hr_week_change_fraction","baseline":"prior_valid_days","baseline_days":7,"min_valid_days":5}],"inputs":[{"concept":"DailyTrainingLoad","dataset":"daily_training_load","fields":["short_term_load","long_term_load","load_ratio"],"metrics":["avg_short_term_load","avg_long_term_load","avg_load_ratio"]},{"concept":"SleepObservation","dataset":"daily_sleep","fields":["main_sleep_min","wake_date"],"metrics":["avg_main_sleep_minutes"]},{"concept":"RestingHeartRate","dataset":"daily_resting_hr","fields":["rhr_bpm","local_date"],"metrics":["avg_resting_hr_bpm"]},{"concept":"ProviderRecoveryEstimate","dataset":"recovery_observation","fields":["recovery_pct","observed_at_utc"],"metrics":["current_recovery_pct"],"role":"corroborating_provider_estimate_not_independent_of_training_load"}],"signals":[{"code":"high_recent_load","default_query_concept":"HighLoadDay","rule":"latest COROS-provided daily_training_load.load_ratio > configured coros_load_ratio_high (default 1.5)","meaning":"recent exercise stress may be high; review recovery and next training session","not":"diagnosis of overtraining","evidence_gate":"A dated, non-null COROS ratio for the same athlete; do not compare avg_load_ratio or recompute the provider's 7/42 weighted ratio."},{"code":"low_recent_load","default_query_concept":"LowLoadDay","rule":"provider load_ratio \u003c 0.8","meaning":"recent load is low relative to provider baseline; review goal and taper/rest context","not":"automatic conclusion that training cannot improve fitness"},{"code":"sleep_duration_42d_outlier","rule":"abs(current main_sleep_min / mean(prior valid 42 wake-days main_sleep_min) - 1) > 0.10","meaning":"duration differs by more than 10% from the personal long baseline","not":"proof of low sleep quality or fatigue"},{"code":"sleep_drop_7d","rule":"current main_sleep_min / mean(prior valid 7 wake-days main_sleep_min) \u003c 0.90","meaning":"recent sleep shortening may contribute to fatigue review","not":"proof of accumulated fatigue"},{"code":"resting_hr_rise_7d","rule":"current rhr_bpm / mean(prior valid 7 local-days rhr_bpm) > 1.10","meaning":"a rise may contribute to fatigue review","not":"diagnosis; illness, environment and measurement changes can also matter"},{"code":"resting_hr_week_change","rule":"abs(mean(current 7 valid local-days rhr_bpm) / mean(previous 7 valid local-days rhr_bpm) - 1) > 0.10","meaning":"week-to-week change to review; only a rise is a fatigue-supporting signal","not":"a standalone fatigue diagnosis"}],"composite_review":{"code":"possible_exercise_related_fatigue_review","rule":"at least two available, distinct signals among high_recent_load, sleep_drop_7d, resting_hr_rise_7d; do not count provider recovery as independent of load","result":"review suggested, with cited values and dates; no numeric fatigue score or automatic plan change","low_load_handling":"low_recent_load is a training-context flag, not a fatigue signal"},"sources":["https://support.coros.com/hc/en-us/articles/26485283220884-EvoLab"   let cur=values(current),prev=values(previous),delta=(key,unit,digits=1)=>{let diff=cur[key]-prev[key],sign=diff>0?'+':'',value=key==='time'?fmt(diff/60,0):fmt(diff,digits);return `${i?'环比':'vs previous period'} ${sign}${value} ${unit}`};
  let latest=load.at(-1),status=latest?.status||'—';
  let statusText=status==='Optimized'?(i?'优化':'Optimized'):status==='Excessive'?(i?'过高':'Excessive'):status==='Maintaining'?(i?'维持':'Maintaining'):status==='Performance'?(i?'巅峰表现':'Performance'):status;
  let insightText=i?`${d.grain==='month'?'本月':'最近一周'}跑量 ${fmt(cur.km,2)} 公里，环比 ${cur.km>=prev.km?'+':''}${fmt(cur.km-prev.km,2)} 公里。最新 COROS 负荷状态：${statusText}，负荷比 ${latest?fmt(latest.ratio,2):'—'}。`
    :`${d.grain==='month'?'This month':'Last 7 days'}: ${fmt(cur.km,2)} km, ${cur.km>=prev.km?'+':''}${fmt(cur.km-prev.km,2)} km versus the previous period. Latest COROS load state: ${statusText}; ratio ${latest?fmt(latest.ratio,2):'—'}.`;
  let label=d.grain==='month'?(i?'本月':'This month'):(i?'最近一周':'Last 7 days');
  return insight(insightText)+`<div class="grid">${stat(`${label} ${i?'跑量':'running volume'}`,`${fmt(cur.km,2)} <small>km</small>`,delta('km','km',2))}${stat(`${label} ${i?'跑步时间':'running time'}`,`${fmt(cur.time/3600,1)} <small>h</small>`,delta('time',i?'分钟':'min',0))}${stat(`${label} ${i?'跑步次数':'run sessions'}`,cur.sessions,delta('sessions',i?'次':'runs',0))}${stat(`${label} ${i?'训练天数':'training days'}`,cur.days,delta('days',i?'天':'days',0))}</div>`+
    `<div class="grid two">${card(i?'跑量与跑步时间':'Running volume and time',`${t().period}: ${d.grain==='week'?t().week:t().month}`,chart(trend,'km','bar','km')+`<div class="note">${i?'同周期跑步时间':'Running time in the same periods'}: ${trend.map(x=>fmt(x.time,1)).join(' · ')} h</div>`)}${card(i?'跑步次数与训练天数':'Sessions and training days',`${t().period}: ${d.grain==='week'?t().week:t().month}`,chart(trend,'sessions','bar',i?'次':'runs','days')+`<div class="legend"><span><i class="swatch"></i>${i?'次数':'Sessions'}</span><span><i class="swatch alt"></i>${i?'天数':'Days'}</span></div>`)}</div>`+
    `<div class="grid two">${card(i?'COROS 短期与长期负荷':'COROS short and long-term load',t().loadRule,chart(load.map(x=>({label:x.date,short:x.short_load,long:x.long_load})),'short','line','points','long'))}${card(i?'COROS 负荷比':'COROS load ratio',t().loadRule,chart(load.map(x=>({label:x.date,ratio:x.ratio})),'ratio','line','ratio'))}</div>`+
    card(i?'每次训练详细记录':'Training detail',t().paceRule+' '+(a.length>25?(i?`显示最近 25 次，共 ${a.length} 次。`:`Showing latest 25 of ${a.length} sessions.`):''),table([t().labelDate,i?'距离':'Distance',i?'时长':'Duration',i?'实测配速':'Measured pace',i?'官方赛事':'Official race'],a.slice(-25).reverse().map(x=>[x.date,x.measured_distance_m==null?'—':fmt(x.measured_distance_m/1000,1)+' km',dur(x.duration_s),x.pace_distance_m>0?pace(x.pace_time_s*1000/x.pace_distance_m):'—',x.is_official_race?x.event_name:'—'])));
}
function performance(){let a=source('runs').filter(x=>x.pace_distance_m>0),g=group(a,state.dates[1].grain),trend=g.map(([label,r])=>({label,pace:weighted(r,'pace_time_s','pace_distance_m')*1000,hr:weighted(r,'hr_weighted_sum_bpm_s','hr_weight_s'),cadence:weighted(r,'cadence_weighted_sum_spm_s','cadence_weight_s')})),races=a.filter(x=>x.is_official_race&&x.official_finish_s!=null),i=state.lang==='zh';return insight(a.length?(i?`实测加权配速 ${pace(weighted(a,'pace_time_s','pace_distance_m')*1000)}；心率 ${fmt(weighted(a,'hr_weighted_sum_bpm_s','hr_weight_s'),0)} bpm。只有 ${g.length} 个时间段，趋势仅供观察。`:`Weighted measured pace ${pace(weighted(a,'pace_time_s','pace_distance_m')*1000)} and heart rate ${fmt(weighted(a,'hr_weighted_sum_bpm_s','hr_weight_s'),0)} bpm. ${g.length} periods are available; interpret direction cautiously.`):t().empty)+`<div class="grid three">${stat(i?'实测配速':'Measured pace',pace(weighted(a,'pace_time_s','pace_distance_m')*1000),t().avg)}${stat(i?'平均心率':'Heart rate',`${fmt(weighted(a,'hr_weighted_sum_bpm_s','hr_weight_s'),0)} <small>bpm</small>`,t().avg)}${stat(i?'官方 10K':'Official 10K',races.length?raceTime(Math.min(...races.map(x=>x.official_finish_s))):'—',t().official)}</div><div class="grid three">${card(i?'实测配速':'Measured pace trend',t().paceRule,chart(trend,'pace','line','s/km'))}${card(i?'平均心率':'Weighted heart rate',t().avg,chart(trend,'hr','line','bpm'))}${card(i?'平均步频':'Weighted cadence',t().avg,chart(trend,'cadence','line','spm'))}</div>${card(i?'逐次表现':'Session performance',t().paceRule,table([t().labelDate,i?'配速':'Pace',i?'心率':'Heart rate',i?'步频':'Cadence'],a.map(x=>[x.date,pace(x.pace_time_s*1000/x.pace_distance_m),fmt(x.hr_weighted_sum_bpm_s/x.hr_weight_s,0)+' bpm',fmt(x.cadence_weighted_sum_spm_s/x.cadence_weight_s,0)+' spm'])))}`}
function gait(){let a=source('laps'),i=state.lang==='zh',m=mean(a,'cadence'),summary=DATA.meta.gait_source_by_athlete?.[state.athlete]==='activity_summary';let stride=x=>x.pace>0&&x.cadence>0?60000/(x.pace*x.cadence):null;let bars=a.map(x=>({label:x.date,cadence:x.cadence,power:x.power,stride:stride(x)})).slice(-20),multi=a.length>new Set(a.map(x=>x.id)).size;
return insight(a.length?(i?`${summary?'跑步摘要':'有效圈段'} ${a.length} 条，平均步频 ${fmt(m,0)} spm；步频应结合配速和训练目的解读，没有统一的“最佳 180”。`:`${a.length} ${summary?'run summaries':'canonical laps'}, average cadence ${fmt(m,0)} spm. Read cadence together with pace and run purpose; there is no universal 180 target.`):t().empty)+`<div class="grid three">${stat(i?'圈段平均步频':'Lap cadence',`${fmt(m,0)} <small>spm</small>`)}${stat(i?'圈段平均功率':'Lap power',`${fmt(mean(a.filter(x=>x.power>0),'power'),0)} <small>W</small>`)}${stat(i?'推算步幅':'Estimated step length',`${fmt(mean(a.map(x=>({stride:stride(x)})).filter(x=>x.stride>0),'stride'),2)} <small>m/step</small>`)}</div><div class="grid two">${card(i?'逐次步频':'Cadence by run',(summary?(i?'每次跑步摘要；暂无圈段分布。':'Per-run summaries; lap distributions are unavailable.'):multi?(i?'最近 12 次跑步的有效圈段分布。':'Canonical-lap distribution for the latest 12 runs.'):t().gaitNote),multi?boxChart(a,'cadence','spm'):chart(bars,'cadence','bar','spm'))}${card(i?'逐次功率':'Power by run',(summary?(i?'每次跑步摘要；暂无圈段分布。':'Per-run summaries; lap distributions are unavailable.'):multi?(i?'最近 12 次跑步的有效圈段分布。':'Canonical-lap distribution for the latest 12 runs.'):t().gaitNote),multi?boxChart(a,'power','W'):chart(bars,'power','bar','W'))}${card(i?'步幅（推算值）':'Estimated stride length',i?'速度÷步频；最近 12 次跑步的圈段分布。':'Speed divided by cadence; canonical-lap distribution for the latest 12 runs.',multi?boxChart(a,'stride','m/step'):chart(bars,'stride','bar','m/step'))}</div>${card(summary?(i?'逐次跑步摘要':'Run summaries'):(i?'圈段明细':'Canonical laps'),t().noGait+' '+(a.length>30?(i?`显示最近 30 条，共 ${a.length} 条。`:`Showing latest 30 of ${a.length} laps.`):''),table([t().labelDate,i?'步频':'Cadence',i?'功率':'Power',i?'配速':'Pace',i?'推算步幅':'Estimated step'],a.slice(-30).reverse().map(x=>[x.date,fmt(x.cadence,0)+' spm',x.power>0?fmt(x.power,0)+' W':'—',pace(x.pace),fmt(stride(x),2)+' m'])))}`}
function recovery(){let load=source('load'),sleep=source('sleep'),rhr=source('rhr'),rec=source('recovery'),latest=rec.at(-1),i=state.lang==='zh';return insight(latest?(i?`最近一次设备恢复度为 ${fmt(latest.pct,0)}%，记录于 ${latest.observed.slice(0,10)}。睡眠和静息心率单独用于复核；当前有 ${load.length} 天负荷数据；42 天基线仍不足。`:`Latest device recovery estimate is ${fmt(latest.pct,0)}% on ${latest.observed.slice(0,10)}. Sleep and resting HR provide separate context. ${load.length} daily load records are available; a 42-day baseline is still unavailable.`):(i?`暂无设备恢复度记录。当前有 ${load.length} 天负荷、${sleep.length} 天睡眠和 ${rhr.length} 天静息心率数据，可分别观察；不足以计算 42 天基线。`:`No device recovery estimate is available. There are ${load.length} load, ${sleep.length} sleep and ${rhr.length} resting-HR days to review separately; a 42-day baseline is unavailable.`))+`<div class="grid three">${stat(i?'恢复度':'Recovery estimate',latest?`${fmt(latest.pct,0)} <small>%</small>`:'—',t().single)}${stat(i?'主睡眠':'Main sleep',`${fmt(mean(sleep,'main_min')/60,1)} <small>h</small>`,i?'所选日期平均':'Selected-date average')}${stat(i?'静息心率':'Resting HR',`${fmt(mean(rhr,'bpm'),0)} <small>bpm</small>`,i?'所选日期平均':'Selected-date average')}</div><div class="grid two">${card(i?'短期与长期负荷':'Short & long-term load',t().loadRule,chart(load.map(x=>({label:x.date,short:x.short_load,long:x.long_load})),'short','line','points','long'))}${card(i?'主睡眠时长':'Main sleep duration',t().recoveryRule,chart(sleep.map(x=>({label:x.date,h:x.main_min/60})),'h','bar','h'))}</div><div class="grid two">${card(i?'静息心率':'Resting heart rate',t().recoveryRule,chart(rhr.map(x=>({label:x.date,bpm:x.bpm})),'bpm','line','bpm'))}${card(i?'负荷比':'Load ratio',t().loadRule,chart(load.map(x=>({label:x.date,ratio:x.ratio})),'ratio','line','ratio'))}</div><div class="note">${esc(t().recoveryRule)} ${esc(t().noTrend)}</div>`}
function foundation(){
  let f=source('fitness'),hr=source('hr_zones',false),pz=source('pace_zones',false),i=state.lang==='zh';
  const say=(en,zh)=>i?zh:en;
  let get=k=>f.find(x=>x.code===k),vo=get('vo2max_running'),th=get('threshold_hr_bpm'),tp=get('threshold_pace_s_per_km');
  const userTarget=pz.find(x=>x.method==='user_threshold_target'&&x.zone===4);
  const targetNote=userTarget?`<p class="note">${esc(say(`Athlete-selected threshold training target: ${pace(userTarget.fast)}–${pace(userTarget.slow)}/km. This is separate from the device's ${pace(tp?.value)}/km threshold estimate.`,`个人设定的阈值跑目标：${pace(userTarget.fast)}–${pace(userTarget.slow)}/公里；与设备估计的阈值配速 ${pace(tp?.value)}/公里分别保存。`))}</p>`:'';
  return insight(f.length?(i?`最大摄氧量和阈值为设备估计的单次快照。读取日期并非设备计算日期，不能仅凭当前记录判断改善幅度。`:`VO₂max and threshold values are single device-estimated snapshots. Their observed dates are fetch times, and changes cannot be inferred from one reading.`):t().empty)+`<div class="grid three">${stat('VO₂max',`${fmt(vo?.value,0)} <small>ml/kg/min</small>`,t().devices)}${stat(i?'阈值心率':'Threshold HR',`${fmt(th?.value,0)} <small>bpm</small>`,t().devices)}${stat(i?'阈值配速':'Threshold pace',pace(tp?.value),t().devices)}</div>${targetNote}<div class="grid two">${card(i?'心率区间':'Heart-rate zones',t().zoneRule,table([i?'区间':'Zone',i?'下限':'Lower',i?'上限（不含）':'Upper (exclusive)'],hr.map(x=>['Z'+x.zone,x.low==null?'—':x.low+' bpm',x.high==null?'—':x.high+' bpm'])))}${card(i?'配速区间':'Pace zones',t().zoneRule,table([i?'区间':'Zone',i?'类型':'Type',i?'较快边界':'Fast edge',i?'较慢边界':'Slow edge'],pz.map(x=>['Z'+x.zone,x.method==='user_threshold_target'?say('Personal training target','个人训练目标'):(x.method||'—'),pace(x.fast),pace(x.slow)])))}</div><div class="note">${esc(t().foundationRule)}</div>`;
}
function todayISO(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function daysAgo(n){let d=new Date();d.setDate(d.getDate()-n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function monthsAgo(n){let d=new Date(),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function render(){
  document.documentElement.lang=state.lang;document.title=t().title+' · DOSI demo';
  $('title').textContent=t().title;$('subtitle').textContent=t().subtitle;
  let latest=own([...DATA.runs,...DATA.load,...DATA.sleep,...DATA.rhr,...(DATA.hrv||[])]).map(dateOf).filter(Boolean).sort().at(-1);
  $('stamp').textContent=(state.lang==='zh'?'数据更新至 ':'Data updated through ')+(latest||'—');
  $('languageZh').classList.toggle('active',state.lang==='zh');$('languageEn').classList.toggle('active',state.lang==='en');
  $('navLabel').textContent=t().workspace;
  $('sideTitle').textContent=t().local;
  $('sideText').textContent=DATA.meta.personal?t().personal:t().fiction;
  $('nav').innerHTML=NAV_ORDER.map(j=>`<button type="button" class="nav ${j===state.tab?'active':''}" data-tab="${j}" aria-current="${j===state.tab?'page':'false'}">${esc(t().tabs[j])}</button>`).join('');
  $('mobileNav').innerHTML=NAV_ORDER.map(j=>`<button type="button" class="nav ${j===state.tab?'active':''}" data-tab="${j}" aria-current="${j===state.tab?'page':'false'}">${esc(t().tabs[j])}</button>`).join('');
  $('athleteLabel').textContent=t().athlete;$('switchNote').textContent=t().switchNote;
  $('athlete').innerHTML=DATA.athletes.map((a,j)=>`<option value="${esc(a.athlete_id)}" ${a.athlete_id===state.athlete?'selected':''}>${esc(a.display_name||`${t().athlete} ${j+1} · ${a.athlete_id}`)}</option>`).join('');
  let d=state.dates[state.tab],gran=state.tab<2;
  let start=`<label>${t().from}<input class="control" id="start" type="date" value="${esc(d.start||'')}"></label>`;
  let end=`<label>${t().to}<input class="control" id="end" type="date" value="${esc(d.end||'')}"></label>`;
  let choices=gran?`<label>${t().period}<select class="control" id="grain"><option value="week" ${d.grain==='week'?'selected':''}>${t().week}</option><option value="month" ${d.grain==='month'?'selected':''}>${t().month}</option></select></label>`:'';
  let quick=(gran?[[84,state.lang==='zh'?'12 周':'12 weeks'],[42,state.lang==='zh'?'6 周':'6 weeks'],[28,state.lang==='zh'?'4 周':'4 weeks'],[112,state.lang==='zh'?'16 周':'16 weeks']]:[[30,state.lang==='zh'?'1 个月':'1 month'],[60,state.lang==='zh'?'2 个月':'2 months'],[180,state.lang==='zh'?'6 个月':'6 months']]);
  let shortcuts=`<div class="shortcuts">${quick.map(([days,label])=>`<button type="button" data-days="${days}">${label}</button>`).join('')}</div>`;
  $('filters').innerHTML=start+end+choices+shortcuts+`<span class="pill">${esc(DATA.meta.personal?t().personal:t().fiction)}</span>`;
  $('content').innerHTML=[daily,performance,gait,recovery,foundation,alerts][state.tab]();
  const live=window.location?.port==='8768'&&['127.0.0.1','localhost'].includes(window.location.hostname);
  $('footer').innerHTML=esc(DATA.meta.personal?t().personalSource:t().source)+(DATA.meta.personal?
    (live?` · ${esc(state.lang==='zh'?'每次刷新都会重新读取本地数据库和本体规则。':'Each refresh reads the local database and ontology rules again.')}`:
      ` · <a href="http://127.0.0.1:8768/dashboard">${esc(state.lang==='zh'?'打开实时本地看板':'Open the live local dashboard')}</a>`):'');
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=async()=>{state.tab=+el.dataset.tab;if(state.tab===5)await refreshOntologyRules();render()});
  for(let k of ['start','end','grain']){let el=$(k);if(el)el.onchange=()=>{if(k==='grain')d.grain=el.value;else for(let j=0;j<6;j++)state.dates[j][k]=el.value;render()}}
  document.querySelectorAll('[data-days]').forEach(el=>el.onclick=()=>{let n=+el.dataset.days,from=gran?daysAgo(n):(n===30?monthsAgo(1):n===60?monthsAgo(2):monthsAgo(6));for(let j=0;j<6;j++){state.dates[j].start=from;state.dates[j].end=todayISO()}render()});
  document.querySelectorAll('[data-alert-filter]').forEach(el=>el.onclick=()=>{state.alertFilter=el.dataset.alertFilter;render()});
  document.querySelectorAll('[data-plan-week]').forEach(el=>el.onclick=()=>{state.planWeek=el.dataset.planWeek;render()});
  document.querySelectorAll('[data-approve-action]').forEach(el=>el.onclick=()=>approveAction(el));
}
async function approveAction(el){
  const zh=state.lang==='zh',action=el.dataset.approveAction,rule=el.dataset.rule,date=el.dataset.date,proposal=el.dataset.proposal;
  if(!window.confirm(zh?`请 Agent 根据这项建议生成新的计划草案？\n\n${proposal}`:`Ask your local Agent to draft this plan change?\n\n${proposal}`))return;
  el.disabled=true;const status=el.closest('.alert-detail').querySelector('.action-status');
  try{
    const sessionResponse=await fetch('/api/action-session',{credentials:'same-origin'});
    if(!sessionResponse.ok)throw Error(zh?'请通过本地行动服务打开看板：http://127.0.0.1:8768/dashboard':'Open the dashboard through the local action service: http://127.0.0.1:8768/dashboard');
    const session=await sessionResponse.json();
    const response=await fetch('/api/approved-actions',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Action-Token':session.token},body:JSON.stringify({athlete_id:state.athlete,rule_code:rule,action_code:action,observation_date:date,proposed_change:proposal})});
    const result=await response.json();if(!response.ok)throw Error(result.error||'Request failed');
    status.textContent=zh?`已批准并送达本地 Agent 队列（${result.id}）；等待 Agent 核对并执行，计划尚未修改。`:`Approved and queued for the local Agent (${result.id}); awaiting verification and execution. Your plan has not changed.`;
    for(let attempt=0;attempt<120&&status.isConnected;attempt++){
      await new Promise(resolve=>setTimeout(resolve,5000));
      const check=await fetch('/api/approved-actions',{credentials:'same-origin'});if(!check.ok)break;
      const row=(await check.json()).actions.find(x=>x.id===result.id);
      if(row?.agent_result){const outcome=row.agent_result;
        status.textContent=outcome.status==='complete'?(zh?`Agent 已完成本地计划草案：${outcome.summary}（${outcome.plan_file}）`:`Agent created a local plan draft: ${outcome.summary} (${outcome.plan_file})`):(zh?`Agent 暂无法执行：${outcome.summary}`:`Agent could not complete this request: ${outcome.summary}`);
        break}
    }
  }catch(error){el.disabled=false;status.textContent=String(error.message||error)}
}
for(let j=0;j<6;j++)state.dates[j]={start:daysAgo(84),end:todayISO(),grain:'week'};
$('athlete').onchange=e=>{state.athlete=e.target.value;state.planWeek=null;hideTooltip();render()};
$('languageZh').onclick=()=>{state.lang='zh';render()};$('languageEn').onclick=()=>{state.lang='en';render()};render();
const tooltip=$('chartTooltip');
function hideTooltip(){tooltip.style.display='none'}
function showTooltip(target,x,y){
  tooltip.textContent=target.dataset.tip;
  tooltip.style.display='block';
  let box=tooltip.getBoundingClientRect();
  tooltip.style.left=Math.max(8,Math.min(window.innerWidth-box.width-8,x+14))+'px';
  tooltip.style.top=Math.max(8,Math.min(window.innerHeight-box.height-8,y+14))+'px';
}
$('content').addEventListener('pointermove',event=>{
  let target=event.target.closest?.('.chart-hit');
  if(target)showTooltip(target,event.clientX,event.clientY);else hideTooltip();
});
$('content').addEventListener('pointerleave',hideTooltip);
$('content').addEventListener('focusin',event=>{
  let target=event.target.closest?.('.chart-hit');
  if(target){let box=target.getBoundingClientRect();showTooltip(target,box.right,box.top)}
});
$('content').addEventListener('focusout',hideTooltip);
$('content').addEventListener('pointerdown',event=>{
  let target=event.target.closest?.('.chart-hit');
  if(target){showTooltip(target,event.clientX,event.clientY);if(event.pointerType==='touch')setTimeout(hideTooltip,4000)}
});
