one, effective goal and plan versions, rule overrides, and last successful data import.","Check source freshness, deduplicate activities, align observation dates, and mark missing or incomplete evidence.","Evaluate biometric_fatigue_override and recovery_rules for completed local dates. Keep one-signal CompromisedRecovery separate from the two-distinct-signal composite fatigue review.","At the end of a completed week, evaluate training_progression_rules and polarized_intensity_distribution only when their stated coverage gates pass.","Review each active GoalCriterion and the next seven dated PlannedActions; distinguish an approved action from a proposed or already completed one.","Check verified race recovery windows and consecutive planned high-intensity sessions; require explicit intensity and recovery evidence before a pass or trigger.","Create a review event with rule code, observation window, values, baseline or provider range, effective threshold, rule version, source IDs, evidence sufficiency, and any affected planned action.","Notify the athlete only for a new actionable review event; explain the evidence and ask for approval before changing a plan.","Record the athlete's response and resulting plan version if the product later supports reminders and revisions."],"candidate_review_rules":["LoadRecoveryReview","ReadyToProgress","CompromisedRecovery","PossibleExerciseRelatedFatigueReview","OvertrainingRisk","WeeklyMileageIncreaseReview","PolarizedHighIntensityReview","GoalProgressReview","PostRaceRecoveryReview","HardEasySequenceReview"],"reminder_policy":{"requires_athlete_opt_in_and_channel":true,"deduplicate_by":["athlete_id","rule_code","observation_window_end","effective_rule_version","planned_action_id_if_any"],"no_repeated_message_without_new_evidence_or_material_plan_change":true,"insufficient_evidence":"State the missing coverage in the periodic review; do not emit a triggered-rule alert.","no_trigger":"Summarize observed trends without claiming the athlete is medically recovered or that a plan is safe.","proposed_change":"Draft only, tied to an exact goal and plan version; require athlete approval.","no_external_provider_write":true,"message_fields":["review_date","plain_language_finding","observed_value","personal_baseline_or_provider_range","threshold","source_dates","affected_plan_action","suggested_review","evidence_limit"]},"required_plan_checks":{"when":["after_a_verified_race_result_is_imported","before_presenting_a_new_plan_version","during_an_approved_plan_review","when_asked_about_training_spacing_or_post_race_readiness"],"resolve":["authorized_athlete","local_timezone","exact_action_plan_version","dated_planned_actions"],"rules":["PostRaceRecoveryReview","HardEasySequenceReview"],"race_evidence":["verified_completion","official_course_distance_km","effective_athlete_recovery_setting"],"sequencing_evidence":["structured_planned_intensity","explicit_easy_or_rest_actions","intervening_date_coverage"],"output":["rule_code","affected_action","dates","plan_version","evidence_status","configured_value","source_ids","proposed_draft_if_triggered"],"missing_input":"Return insufficient_evidence or unknown with the specific missing item; do not assume an empty day was rest or a watch distance was the course distance.","approval":"Never edit an approved plan or external wearable schedule without athlete approval."}},"goal_review_workflow":{"concept":"GoalReviewWorkflow","persistence":"none","interpretation":"Agent procedure, not a queryable warehouse entity or an automatically executed ontology rule.","steps":[{"name":"resolve_goal","read_concepts":["Athlete","Goal","GoalCriterion"],"check":"Select the athlete and exact goal version, then filter GoalCriterion by athlete_id, goal_id and goal_version. The Goal.has_criterion arrow is conceptual; use the queryable GoalCriterion.belongs_to relation or the versioned criterion keys. Retain concurrent goals separately."},{"name":"review_progress","read_concepts":["GoalProgressAssessment","GoalProgressEvidence"],"check":"Read the latest applicable criterion-specific review and filter GoalProgressEvidence by athlete_id, assessment_id and assessment_version. The assessment's supported_by arrow is conceptual; use the queryable GoalProgressEvidence.supports relation. Retain cited source records, time window, units, status and method version. Insufficient evidence stays insufficient."},{"name":"review_context","read_concepts":["Capability","MetricEvidence","RecoveryState","RecoveryEvidence"],"check":"Treat capability and recovery as context for a next step, not a substitute for the goal criterion result."},{"name":"inspect_plan","read_concepts":["ActionPlan","PlannedAction"],"check":"Select the plan linked to that goal version. Separate approved actions, proposals, verified completion and candidate event matches."},{"name":"propose_next_step","read_concepts":["InferredState","Recommendation"],"check":"Cite the review and supporting observations; require human review before changing a plan or treating a candidate as completed."}]},"capability_evidence":[{"capability":"running_pace_capacity","concept_refs":["PaceZone"],"dataset_refs":["running_pace_zone"],"metric_refs":[],"relation":"versioned_profile_may_support_running_capability_trend","confidence":"contextual","conditions":["same_athlete_and_zone_index","same_device_and_scheme_method","distinct_effective_dates","compare_both_zone_boundaries_in_seconds_per_kilometer","corroborate_with_comparable_running_observations"],"interpretation":"Lower pace seconds per kilometer means a faster boundary. A change across comparable dated profiles may reflect improved running capacity; it may also reflect recalibration or provider algorithm changes. One zone snapshot cannot establish improvement. This is not recovery evidence."},{"capability":"aerobic_capacity","concept_refs":["FitnessAssessment"],"context_concept_refs":["HeartRateZone","PaceZone"],"dataset_refs":["latest_fitness_measurement"],"metric_refs":["latest_vo2max_running"],"zone_context":["running_hr_zone","running_pace_zone"],"relation":"provider_estimates","confidence":"contextual","interpretation":"Device estimate; compare the same device over time and with actual performance, not with laboratory VO2max as if interchangeable."},{"capability":"aerobic_endurance","concept_refs":["RunningObservation"],"context_concept_refs":["HeartRateZone","PaceZone","DailyTrainingLoad"],"dataset_refs":["running_observation"],"metric_refs":["measured_pace_s_per_km","weighted_avg_hr_bpm"],"zone_context":["running_hr_zone","running_pace_zone"],"relation":"paired_metrics_may_indicate","confidence":"exploratory","conditions":["same_run_type","comparable_route_and_weather","compatible_timing_basis","multiple_sessions"],"interpretation":"Faster pace at similar heart rate, or lower heart rate at similar pace, may be a trend; activity averages cannot establish a controlled test."},{"capability":"threshold_endurance","concept_refs":["FitnessAssessment","RunningObservation"],"context_concept_refs":["HeartRateZone","PaceZone"],"dataset_refs":["latest_fitness_measurement","running_observation"],"metric_refs":["latest_threshold_pace_s_per_km","latest_threshold_hr_bpm"],"zone_context":["running_hr_zone","running_pace_zone"],"relation":"provider_estimates","confidence":"contextual","conditions":["same_test_protocol","source_and_retrieval_time_shown"],"interpretation":"Do not infer a threshold from an ordinary run's average heart rate."},{"capability":"running_mechanics","concept_refs":["RunningObservation","SourceActivity"],"dataset_refs":["running_observation","running_power_observation","running_lap"],"metric_refs":["weighted_avg_cadence_spm","avg_power_w","lap_avg_cadence_spm","lap_avg_power_w"],"relation":"describes_output_not_ability_score","confidence":"descriptive","conditions":["same_device_and_mode","comparable_pace_and_terrain"],"interpretation":"Higher cadence or power is not inherently better; these metrics alone do not measure running economy."},{"capability":"race_performance","concept_refs":["TrainingSession"],"dataset_refs":["workout_event"],"metric_refs":["official_10k_net_time_s"],"relation":"validates_outcome","confidence":"observed","conditions":["official_race","same_distance_and_clock_basis"],"interpretation":"Race time reflects several abilities and race conditions; keep official and watch times separate."}],"training_exposure":{"metric_refs":["measured_run_distance_km","identified_run_time_s","run_session_count","run_day_count","coros_training_load"],"interpretation":"These describe training performed or device-estimated load, not a physiological ability. Filter standalone runs when answering a pure running question; do not add load scores across brands."},"recovery_context":{"dataset_refs":["daily_training_load","daily_sleep","daily_resting_hr","recovery_observation"],"metric_refs":["avg_short_term_load","avg_long_term_load","avg_load_ratio","avg_main_sleep_minutes","avg_sleep_score","avg_resting_hr_bpm","current_recovery_pct"],"interpretation":"These inform readiness to train and how to interpret an ability trend; they are not direct measures of aerobic capacity, endurance or running mechanics. COROS short/long load and source ratio are preserved as given; do not rename them ACWR or infer a fixed 7/28-day formula. Recovery percentage currently has only one observation and cannot form a history.","fatigue_proxy":"Use device-estimated daily short-term load, long-term load, source ratio and provider status as evidence of recent exercise stress; use the time-stamped COROS recovery estimate as a separate provider estimate. Sleep and resting heart rate are independent context, not inputs claimed to be in the COROS recovery formula. Do not infer all bodily fatigue or diagnose overreaching from load alone."},"inference_state_policy":{"persistence":"none","execution":"agent_review_only","interpretation":"Review flags are possible interpretations of cited observations, not measured values, diagnoses, or saved athlete states.","reuse_saved_assessments":"Read GoalProgressAssessment and RecoveryState instead of duplicating their stored conclusions as new state rows.","missing_evidence":"Do not emit a state when its listed evidence gate is unmet; keep disabled codes disabled."},"rule_thresholds":{"configuration":"Agent-facing defaults. An athlete-specific override may replace the default for that athlete; record the override value, effective date, and rule version with each review. This catalog does not store overrides or execute rules.","athlete_overrides":[],"defaults":{"coros_load_ratio_high":1.5,"completed_week_distance_growth_fraction":0.1,"high_intensity_session_fraction":0.2,"resting_hr_above_7d_baseline_bpm":5,"sleep_score_below_42d_baseline_fraction":0.1},"comparison":"Strictly greater than the configured threshold; equality does not trigger the review flag."},"recommendation_policy":{"persistence":"none","execution":"agent_suggestion_only","evidence":"Cite the relevant saved goal-progress or recovery review and its source observations. A missing or disabled inferred state cannot justify a recommendation.","human_decision":"The athlete decides whether to change a plan. A proposal does not approve or apply an ActionPlan or PlannedAction.","accepted_change":"If the athlete approves a change, record the resulting plan or action revision in the versioned plan model; this catalog does not store a separate acceptance event.","external_write":"Never write a proposed adjustment to COROS or another provider automatically."},"inference_states":[{"code":"LoadRecoveryReview","status":"review_only","evidence":["training_exposure","recovery_context"],"recommendation_options":["ScaleBackVolume","InsertRestDay"],"rule":"Review several days of device-estimated load together with available sleep, resting heart rate and running-performance trends; one load cutoff does not measure total bodily fatigue or diagnose overreaching. No subjective-feedback input is required."},{"code":"ReadyToProgress","status":"review_only","evidence":["training_exposure","recovery_context","aerobic_endurance"],"recommendation_options":["ProgressIntensity"],"rule":"Consider only after several stable weeks with adequate recovery evidence; a person approves any change."},{"code":"GoalProgressReview","status":"needs_goal_criterion_and_comparable_evidence","evidence":["goal_criterion","matching_semantic_metric_or_milestone","dated_source"],"recommendation_options":[],"rule":"Review each criterion using a matching metric, unit, period and comparator. Race-time gaps need same-distance results or labelled predictions; sleep goals use observed sleep metrics; training-consistency goals use run counts or days; body-composition goals remain unsupported until suitable measurements exist. Missing target or evidence yields insufficient_evidence, not a fabricated percentage."},{"code":"CardiacDriftDetected","status":"disabled_missing_sample_series","evidence":[],"recommendation_options":[],"rule":"Requires continuous, valid heart-rate and speed samples from a steady run; activity averages do not establish drift."},{"code":"PostRaceRecoveryReview","status":"review_only_requires_verified_race_distance_and_athlete_policy","evidence":["verified_completed_race","course_distance_km","approved_plan","planned_intensity","rule_version"],"recommendation_options":["InsertRestDay","ScaleBackVolume"],"rule":"Flag a proposed high-intensity action inside the athlete-configured post-race easy/rest window. Review an approved plan and propose a new draft; do not silently change or block the approved plan."},{"code":"HardEasySequenceReview","status":"review_only_requires_structured_plan_intensity","evidence":["dated_planned_actions","planned_intensity","explicit_easy_or_rest_action","rule_version"],"recommendation_options":["InsertRestDay"],"rule":"Flag consecutive planned high-intensity sessions with no explicit intervening easy run or rest day. A blank calendar day is unknown, not proof of rest."},{"code":"OverreachingRisk","status":"disabled_insufficient_evidence","evidence":[],"recommendation_options":[],"rule":"A load ratio alone must not be classified as overreaching or injury risk."},{"code":"OvertrainingRisk","status":"review_only","evidence":["high_recent_load"],"recommendation_options":["ScaleBackVolume"],"rule":"Name retained for the requested workflow. Only flag a COROS-provided daily load_ratio strictly above the athlete's configured threshold (default 1.5) as high-load stress needing review. This is not a diagnosis of overtraining syndrome, overreaching, or injury risk. Cite the ratio, local date, source, and rule version. Suggest reducing upcoming volume for human review; do not modify a plan automatically."},{"code":"WeeklyMileageIncreaseReview","status":"review_only","evidence":["completed_week_distance_growth"],"recommendation_options":["ScaleBackVolume"],"rule":"When two complete, comparable calendar weeks of measured standalone running exist, flag current-week kilometers strictly above prior-week kilometers multiplied by 1 plus the configured growth fraction (default 0.10). Review the planned increase with the runner. This is a planning heuristic, not an injury-risk diagnosis or universal safe limit."},{"code":"PolarizedHighIntensityReview","status":"review_only_when_focus_coverage_complete","evidence":["coros_primary_training_focus_for_each_completed_run","complete_week_and_deduplicated_sessions"],"recommendation_options":["ReviewNextInterval"],"rule":"Follow polarized_intensity_distribution.weekly_review. Count the COROS primary focus of each unique completed run; if the high-label share is strictly above the configured 20% default, propose reviewing the next interval session. Do not infer time in zone or a physiological HighStrain state."},{"code":"CompromisedRecovery","status":"agent_review_only_no_automatic_evaluator","evidence":["resting_hr_above_personal_baseline_bpm","overnight_hrv_below_provider_normal_range_when_available","sleep_score_below_personal_42d_baseline"],"recommendation_options":["DraftActiveRecoveryOrRest"],"rule":"Follow biometric_fatigue_override. A valid signal prompts a dated recovery review; when an uncompleted key workout is scheduled for that day, propose an easier action in a new draft ActionPlan version and notify the athlete for approval. Do not change an approved plan or a COROS schedule automatically. This is not a diagnosis."},{"code":"PossibleExerciseRelatedFatigueReview","status":"review_only","evidence":["high_recent_load","sleep_drop_7d","resting_hr_rise_7d"],"recommendation_options":["ScaleBackVolume","InsertRestDay"],"rule":"Follow recovery_rules.composite_review: require at least two distinct available signals, report source dates and coverage, and ask the person to review the next training step. No diagnosis or automatic plan change."}],"not_currently_available":["per_sample_zone_time","cardiac_drift","stride_length_and_ground_contact_time_as_validated_metrics","automatic_plan_modification"],"goal_criteria_examples":[{"goal_type":"race","criterion":"finish_or_time","supported_metric_refs":["official_10k_net_time_s","official_finish_time_s"],"requirements":"Same-distance official result or labelled prediction for time-gap assessment; completion can use milestone review."},{"goal_type":"running_consistency","criterion":"sessions_or_days_per_week","supported_metric_refs":["run_session_count","run_day_count","measured_run_distance_km"],"requirements":"Define target, week boundaries and standalone-run filter."},{"goal_type":"sleep","criterion":"sleep_duration_or_quality_trend","supported_metric_refs":["avg_main_sleep_minutes","avg_daily_sleep_minutes","avg_sleep_score"],"requirements":"Define period, wake-date alignment and source-specific score interpretation."},{"goal_type":"body_composition","criterion":"body_mass_or_body_fat_trend","supported_metric_refs":[],"requirements":"Requires consented, dated body measurement data and appropriate semantic metrics; do not infer from training load or calories."}],"recovery_rules":{"status":"agent_review_rules_not_executable_ontology_reasoner","scope":"athlete and source; align sleep by wake_date and load/resting heart rate by local_date in the athlete timezone","provenance":"user_configured_thresholds_with_provider_context","baseline_policy":{"exclude_current_day":true,"short_window_days":7,"long_sleep_window_days":42,"proposed_min_valid_days_7":5,"proposed_min_valid_days_42":28,"missing_data":"insufficient_evidence"},"inputs":[{"concept":"DailyTrainingLoad","dataset":"daily_training_load","fields":["short_term_load","long_term_load","load_ratio"],"metrics":["avg_short_term_load","avg_long_term_load","avg_load_ratio"]},{"concept":"SleepObservation","dataset":"daily_sleep","fields":["main_sleep_min","wake_date"],"metrics":["avg_main_sleep_minutes"]},{"concept":"RestingHeartRate","dataset":"daily_resting_hr","fields":["rhr_bpm","local_date"],"metrics":["avg_resting_hr_bpm"]},{"concept":"ProviderRecoveryEstimate","dataset":"recovery_observation","fields":["recovery_pct","observed_at_utc"],"metrics":["current_recovery_pct"],"role":"corroborating_provider_estimate_not_independent_of_training_load"}],"signals":[{"code":"high_recent_load","rule":"latest COROS-provided daily_training_load.load_ratio > configured coros_load_ratio_high (default 1.5)","meaning":"recent exercise stress may be high; review recovery and next training session","not":"diagnosis of overtraining","evidence_gate":"A dated, non-null COROS ratio for the same athlete; do not compare avg_load_ratio or recompute the provider's 7/42 weighted ratio."},{"code":"low_recent_load","rule":"provider load_ratio \u003c 0.8","meaning":"recent load is low relative to provider baseline; review goal and taper/rest context","not":"automatic conclusion that training cannot improve fitness"},{"code":"sleep_duration_42d_outlier","rule":"abs(current main_sleep_min / mean(prior valid 42 wake-days main_sleep_min) - 1) > 0.10","meaning":"duration differs by more than 10% from the personal long baseline","not":"proof of low sleep quality or fatigue"},{"code":"sleep_drop_7d","rule":"current main_sleep_min / mean(prior valid 7 wake-days main_sleep_min) \u003c 0.90","meaning":"recent sleep shortening may contribute to fatigue review","not":"proof of accumulated fatigue"},{"code":"resting_hr_rise_7d","rule":"current rhr_bpm / mean(prior valid 7 local-days rhr_bpm) > 1.10","meaning":"a rise may contribute to fatigue review","not":"diagnosis; illness, environment and measurement changes can also matter"},{"code":"resting_hr_week_change","rule":"abs(mean(current 7 valid local-days rhr_bpm) / mean(previous 7 valid local-days rhr_bpm) - 1) > 0.10","meaning":"week-to-week change to review; only a rise is a fatigue-supporting signal","not":"a standalone fatigue diagnosis"}],"composite_review":{"code":"possible_exercise_related_fatigue_review","rule":"at least two available, distinct signals among high_recent_load, sleep_drop_7d, resting_hr_rise_7d; do not count provider recovery as independent of load","result":"review suggested, with cited values and dates; no numeric fatigue score or automatic plan change","low_load_handling":"low_recent_load is a training-context flag, not a fatigue signal"},"sources":["https://support.coros.com/hc/en-us/articles/26485283220884-EvoLab","https://support.coros.com/hc/en-us/articles/15406707571732-Understanding-the-Recovery-Widget"],"ontology_concept":"RecoveryRule","rule_dataset":"recovery_rule","provider_bands":{"recovery_pct":"0–\u003c20 exhausted; 20–\u003c70 fatigued; 70–\u003c90 normal; 90–100 fresh (COROS running fitness help)","load_ratio":"0–\u003c0.5 decreasing; 0.5–\u003c0.8 resuming/performance; 0.8–\u003c1.0 maintaining; 1.0–\u003c1.5 optimized; >=1.5 excessive (COROS EvoLab)"}},"training_progression_rules":{"status":"agent_review_rules_not_executable_ontology_reasoner","signal":{"code":"completed_week_distance_growth","concept":"RunningObservation","dataset":"running_observation","semantic_metric":"measured_run_distance_km","scope":"Same athlete, standalone running, measured distance only; exclude hybrid segments without measured distance and HYROX rule-reference kilometers.","periods":"Two completed, consecutive local Monday-to-Sunday calendar weeks; never compare a partial current week with a full prior week.","rule":"current_week_measured_km > prior_week_measured_km * (1 + configured completed_week_distance_growth_fraction)","default_growth_fraction":0.1,"evidence_gate":"Prior week distance > 0 and both weeks have verified import coverage and comparable source/dedup rules; otherwise insufficient_evidence.","meaning":"Review the proposed mileage increase and recovery context before accepting the next week's plan.","not":"A prediction of injury or a guarantee that a smaller increase is safe."},"sources":["https://research.rug.nl/files/2727628/Buist_2008_Am_J_Sports_Med.pdf","https://www.klokeavskade.no/globalassets/publications/brandt-frandsen_2025_how-much-running-is-too-much.....pdf"]},"polarized_intensity_distribution":{"status":"provider_session_focus_review_only","purpose":"Athlete-configurable session-count review using COROS's primary Training Focus label; not measured time in physiological domains.","primary_method":"provider_training_focus_per_completed_run","source_dataset":"activity","source_field":"training_focus","scope":"Canonical or unique COROS running activities only; count each workout_event_id once and keep hybrid workouts separate.","provider_focus_mapping":{"low":["Recovery","Easy","Base"],"moderate":["Tempo"],"high":["Threshold","VO2 Max","Anaerobic"],"unknown":"Null, unrecognized or unavailable focus; report separately and suppress the weekly flag until reviewed."},"mapping_note":"This maps the provider's primary training effect to a session-level planning category. It does not imply all minutes in that run were in the mapped physiological domain. Threshold is placed in high because its focus is around lactate-threshold pace; the mapping is a configurable project choice.","availability":"The personal StarRocks and DuckDB activity table contains training_focus. The public synthetic activity schema and DOSI semantic model expose the same source field; the week-level ratio remains an external rule evaluation, with a local SQL example.","physiological_model":"low below LT1; moderate from LT1 to below LT2; high at or above LT2. Use measured thresholds when available.","secondary_proxy_method":"threshold_relative_v1_for_comparison_only","inputs":{"threshold_hr_metric":"latest_threshold_hr_bpm","threshold_pace_metric":"latest_threshold_pace_s_per_km","threshold_history":"Use the estimate effective on the workout date, not the latest value for historical runs.","preferred_observations":"Valid heart-rate sample durations; pace sample durations only as a labeled fallback. Activity or lap averages cannot recover time in each domain."},"configurable_proxy_boundaries":{"heart_rate":{"low":"sample_bpm \u003c 0.85 * threshold_hr_bpm","moderate":"0.85 * threshold_hr_bpm \u003c= sample_bpm \u003c threshold_hr_bpm","high":"sample_bpm >= threshold_hr_bpm"},"pace_seconds_per_km":{"low":"sample_pace_s_per_km > 1.12 * threshold_pace_s_per_km","moderate":"threshold_pace_s_per_km \u003c sample_pace_s_per_km \u003c= 1.12 * threshold_pace_s_per_km","high":"sample_pace_s_per_km \u003c= threshold_pace_s_per_km"},"note":"These continuous boundaries resolve the supplied 100%-101% and 112%-115% gaps. The 1.12 low boundary is a configurable choice within the supplied 1.12-1.15 range, not a validated LT1 estimate. Faster pace means fewer seconds per kilometer. Round only for display, after classification."},"exclusions":["No subjective RPE input; the athlete explicitly removed subjective feedback from this project.","Do not assign a whole interval session to one domain from its average heart rate or pace.","Do not treat watch five-zone indices as physiological domains without an athlete- and scheme-specific mapping."],"weekly_review":{"code":"PolarizedHighIntensityReview","state":"review_only_when_focus_coverage_complete","period":"Complete local Monday-to-Sunday week; count deduplicated, completed running workouts only.","denominator":"Count of low, moderate and high classified running sessions; show moderate separately, never fold it into low.","numerator":"Count of high-classified running sessions.","formula":"numerator / denominator > configured high_intensity_session_fraction (default 0.20)","evidence_gate":"Require a nonzero denominator, a primary focus label on every included running session, complete weekly import and a single selected canonical activity per workout. Otherwise insufficient_evidence.","interpretation":"Session-count training-distribution planning review, not an 80/20 time-in-zone measurement, a measured HighStrain physiological state or a diagnosis.","suggested_action":"Propose changing the next uncompleted IntervalSession to an EasyRun in a new draft ActionPlan version; the athlete must approve it. Do not overwrite an approved action.","missing_model":"TrainingPhase and structured interval/easy action types are not yet represented; current PlannedAction action_kind is generic run."},"sources":["https://support.coros.com/hc/en-us/articles/360061452651-COROS-Fitness-Metrics-Explained","https://pmc.ncbi.nlm.nih.gov/articles/PMC7689383/","https://pmc.ncbi.nlm.nih.gov/articles/PMC4621419/"]},"biometric_fatigue_override":{"status":"agent_review_rule_not_automated","scope":"Athlete-local date; compare the morning's rest and the sleep ending that morning before the scheduled workout.","threshold_policy":"User-configurable per athlete; record the effective values and rule version when evaluating. Defaults below are project choices, not COROS-certified cutoffs.","resting_hr":{"concept":"RestingHeartRate","dataset":"daily_resting_hr","field":"rhr_bpm","baseline":"Mean of valid observations in the preceding 7 local da   let box=tooltip.getBoundingClientRect();
  tooltip.style.left=Math.max(8,Math.min(window.innerWidth-box.width-8,x+14))+'px';
  tooltip.style.top=Math.max(8,Math.min(window.innerHeight-box.height-8,y+14))+'px';
}
$('content').addEventListener('pointermove',event=>{
  let target=event.target.closest?.('.chart-hit');
  if(target)showTooltip(target,event.clientX,event.clientY);else hideTooltip();
});
$('content').addEventListener('pointerleave',hideTooltip);
$('content').addEventListener('focusin',event=>{
  let target=event.target.closest?.('.chart-hit');
  if(target){let box=target.getBoundingClientRect();showTooltip(target,box.right,box.top)}
});
$('content').addEventListener('focusout',hideTooltip);
$('content').addEventListener('pointerdown',event=>{
  let target=event.target.closest?.('.chart-hit');
  if(target){showTooltip(target,event.clientX,event.clientY);if(event.pointerType==='touch')setTimeout(hideTooltip,4000)}
});
</script></body></html>
