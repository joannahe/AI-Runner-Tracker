          dialects:
          - dialect: STARROCKS
            expression: athlete_id
        name: athlete_id
      - expression:
          dialects:
          - dialect: STARROCKS
            expression: workout_event_id
        label: Workout event id
        name: workout_event_id
      - dimension:
