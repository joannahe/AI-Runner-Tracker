    metrics:
    - name: measured_pace_s_per_km
      description: 'Measured pace: 1000 × total pace time / total measured pace distance.'
      ai_context:
        instructions: Include positive measured distances with consistent timing; never average segment paces directly.
          Return null for a zero denominator.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: 1000.0 * SUM(running_observation.pace_time_s) / NULLIF(SUM(running_observation.pace_distance_m),
            0)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","running","pace"],"unit":"s/km"}'
    - name: avg_speed_kmh
      description: 'Average speed: 3.6 × total measured distance / total pace time.'
      ai_context:
        instructions: Use the same observations as measured pace. Faster speed and lower pace are the same evidence,
          not independent improvements.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: 3.6 * SUM(running_observation.pace_distance_m) / NULLIF(SUM(running_observation.pace_time_s),
            0)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","running","speed"],"unit":"km/h"}'
    - name: weighted_avg_hr_bpm
      description: 'Duration-weighted running heart rate: sum of weighted heart-rate values divided by valid seconds.'
      ai_context:
        instructions: Filter pace, heart rate, and cadence independently; a mean heart rate is not time spent in
          a zone.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: SUM(running_observation.hr_weighted_sum_bpm_s) / NULLIF(SUM(running_observation.hr_weight_s),
            0)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","running","heart_rate"],"unit":"bpm"}'
    - name: weighted_avg_cadence_spm
      description: Duration-weighted running cadence in bilateral steps per minute.
      ai_context:
        instructions: Exclude missing or zero running cadence and non-running stroke rates. Higher cadence is not
          necessarily better.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: SUM(running_observation.cadence_weighted_sum_spm_s) / NULLIF(SUM(running_observation.cadence_weight_s),
            0)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","running","cadence"],"unit":"spm"}'
    - name: measured_run_distance_km
      description: Measured running distance in kilometers, excluding nominal rule-reference distance.
      ai_context:
        instructions: Missing hybrid distance can undercount volume; keep reference distance separate.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: SUM(running_observation.measured_distance_m) / 1000.0
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","training","volume"],"unit":"km"}'
    - name: identified_run_time_s
      description: Total identified running-segment duration in seconds.
      ai_context:
        instructions: Separate standalone and hybrid runs; unknown hybrid segments may contain additional running.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: SUM(running_observation.duration_s)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","training","duration"],"unit":"s"}'
    - name: run_session_count
      description: Count of distinct workout events containing a running observation.
      ai_context:
        instructions: Eight running legs in one hybrid workout still count as one session; two workouts on one day
          count twice.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: COUNT(DISTINCT running_observation.workout_event_id)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","training","frequency"],"unit":"count"}'
    - name: run_day_count
      description: Count of distinct calendar days containing a running observation.
      ai_context:
        instructions: Two workouts on the same day count as one running day.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: COUNT(DISTINCT running_observation.event_date)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","training","frequency"],"unit":"days"}'
    - name: coros_training_load
      description: Sum of COROS training-load scores on synchronized running and hybrid activities.
      ai_context:
        instructions: Deduplicate source activities. Do not add scores from different brands or present this as
          all-sport load.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: SUM(CASE WHEN activity.source = 'coros' AND activity.dedup_status = 'canonical' THEN activity.training_load
            END)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","training","load"],"unit":"points"}'
    - name: hyrox_run_time_sum_s
      description: Sum of eight rule-reference running-leg durations for an official HYROX race.
      ai_context:
        instructions: Group by race and check all eight legs are present; do not derive this from activity average
          pace.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: SUM(running_rule_reference.duration_s)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","hyrox","run"],"unit":"s"}'
    - name: hyrox_rule_reference_pace_s_per_km
      description: Rule-reference running pace from summed leg time and nominal distance.
      ai_context:
        instructions: Nominal one-kilometer legs are not measured distances. Keep reference and measured pace separate.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: SUM(running_rule_reference.duration_s) * 1000.0 / NULLIF(SUM(running_rule_reference.reference_distance_m),
            0)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","hyrox","pace"],"unit":"s/km"}'
    - name: hyrox_run_pace_cv_pct
      description: Coefficient of variation of nominally equal-distance HYROX running-leg times.
      ai_context:
        instructions: Group by race; a lower value means more even nominal legs, not necessarily lower true speed
          variation.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: 100.0 * STDDEV_POP(running_rule_reference.duration_s) / NULLIF(AVG(running_rule_reference.duration_s),
            0)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","hyrox","uniformity"],"unit":"%"}'
    - name: hyrox_second_half_pace_change_s_per_km
      description: Average duration of legs five to eight minus legs one to four at nominal one-kilometer grain.
      ai_context:
        instructions: Require all eight legs. Positive means a slower second half; venue and segment boundaries
          affect comparison.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: SUM(CASE WHEN running_rule_reference.run_index BETWEEN 5 AND 8 THEN running_rule_reference.duration_s
            ELSE 0 END) / 4.0 - SUM(CASE WHEN running_rule_reference.run_index BETWEEN 1 AND 4 THEN running_rule_reference.duration_s
            ELSE 0 END) / 4.0
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","hyrox","pace"],"unit":"s/km"}'
    - name: hyrox_station_time_s
      description: Team watch time at each identified HYROX station.
      ai_context:
        instructions: Compare matching conditions only. Team times with different partners cannot establish individual
          improvement.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: SUM(hyrox_station.watch_station_time_s)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","hyrox","station"],"unit":"s"}'
    - name: avg_short_term_load
      description: Mean COROS short-term load across days with data.
      ai_context:
        instructions: Do not sum this with activity-level training load or fill missing days with zero.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(daily_training_load.short_term_load)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","training_load","short_term"]}'
    - name: avg_long_term_load
      description: Mean COROS long-term load across days with data.
      ai_context:
        instructions: A one-day query returns the source value; exclude missing days.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(daily_training_load.long_term_load)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","training_load","long_term"]}'
    - name: avg_load_ratio
      description: Mean of COROS-provided daily short-to-long load ratios.
      ai_context:
        instructions: Average the daily ratio values; do not substitute a ratio of two averages.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(daily_training_load.load_ratio)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","training_load","ratio"]}'
    - name: excessive_load_days
      description: Count of days labeled Excessive by COROS.
      ai_context:
        instructions: Count recorded provider labels only; this is not a medical assessment.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: COUNT(DISTINCT CASE WHEN daily_training_load.provider_status = 'Excessive' THEN daily_training_load.local_date
            END)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","training_load","excessive_days"],"unit":"days"}'
    - name: avg_main_sleep_minutes
      description: Mean main-sleep minutes on days with a main sleep record.
      ai_context:
        instructions: Align by wake date; exclude nap-only and missing main-sleep days.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(daily_sleep.main_sleep_min)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","sleep","main_minutes"],"unit":"min"}'
    - name: avg_daily_sleep_minutes
      description: Mean total daily sleep minutes on days with data.
      ai_context:
        instructions: Exclude missing values; do not infer an absent main sleep period.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(daily_sleep.daily_sleep_min)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","sleep","daily_minutes"],"unit":"min"}'
    - name: avg_sleep_score
      description: Mean valid sleep score.
      ai_context:
        instructions: Exclude nulls; source placeholders 0 and -1 have already been mapped to null.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(daily_sleep.sleep_score)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","sleep","score"]}'
    - name: sleep_days_with_main
      description: Count of wake dates with a recorded main sleep period.
      ai_context:
        instructions: Show the number of calendar days in the requested period when reporting coverage.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: COUNT(DISTINCT CASE WHEN daily_sleep.main_sleep_min IS NOT NULL THEN daily_sleep.wake_date
            END)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","sleep","days_with_main"],"unit":"days"}'
    - name: avg_resting_hr_bpm
      description: Mean resting heart rate over days with a recorded value.
      ai_context:
        instructions: Keep missing values null and compare using the same device convention.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(daily_resting_hr.rhr_bpm)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","resting_hr","avg"],"unit":"bpm"}'
    - name: rhr_observed_days
      description: Number of dates with a valid resting-heart-rate record.
      ai_context:
        instructions: Count distinct local dates with a non-null value.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: COUNT(DISTINCT CASE WHEN daily_resting_hr.rhr_bpm IS NOT NULL THEN daily_resting_hr.local_date
            END)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","resting_hr","observed_days"],"unit":"days"}'
    - name: current_recovery_pct
      description: Latest captured COROS recovery percentage; a point estimate, not a daily history.
      ai_context:
        instructions: Report the observation time. Do not treat the highest percentage as the latest reading.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(recovery_observation.recovery_pct)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","window":{"value":{"function":"first_value","order":{"by":"time","direction":"desc"},"partition":{"mode":"none"}}},"subject_path":["fitness","recovery","current"],"unit":"%"}'
    - name: latest_vo2max_running
      description: Latest observed COROS running VO2max estimate.
      ai_context:
        instructions: Read the running VO2max metric code; do not equate a device estimate with laboratory measurement.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(CASE WHEN latest_fitness_measurement.metric_code = 'vo2max_running' THEN latest_fitness_measurement.metric_value
            END)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","fitness_measurement","vo2max"],"unit":"mL/kg/min"}'
    - name: latest_threshold_pace_s_per_km
      description: Latest observed threshold pace in seconds per kilometer.
      ai_context:
        instructions: Read the threshold-pace metric code and display as minutes and seconds per kilometer.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(CASE WHEN latest_fitness_measurement.metric_code = 'threshold_pace_s_per_km' THEN latest_fitness_measurement.metric_value
            END)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","fitness_measurement","threshold_pace"],"unit":"s/km"}'
    - name: latest_threshold_hr_bpm
      description: Latest observed threshold heart rate in beats per minute.
      ai_context:
        instructions: The device calculation date is unknown; report the retrieval timestamp.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(CASE WHEN latest_fitness_measurement.metric_code = 'threshold_hr_bpm' THEN latest_fitness_measurement.metric_value
            END)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","fitness_measurement","threshold_hr"],"unit":"bpm"}'
    - name: official_10k_net_time_s
      description: Best official net time from a 10-kilometer race.
      ai_context:
        instructions: Use only official 10km events and the official finish time.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: MIN(CASE WHEN workout_event.is_official_race = TRUE AND workout_event.race_format_code = '10km'
            THEN workout_event.official_finish_s END)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","race","official_10k"],"unit":"s"}'
    - name: official_finish_time_s
      description: Official chip finish time for a HYROX event, in seconds.
      ai_context:
        instructions: Keep official and watch times separate. Group by race; do not add or substitute these times.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: MIN(workout_event.official_finish_s)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","race","official_finish"],"unit":"s"}'
    - name: watch_elapsed_time_s
      description: Watch elapsed time for a HYROX event, in seconds.
      ai_context:
        instructions: Keep watch and official times separate. Group by race; do not add or substitute these times.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: MIN(workout_event.watch_elapsed_s)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","race","watch_elapsed"],"unit":"s"}'
    - name: run_volume_change_pct
      description: Percentage change in measured running volume between adjacent complete calendar months.
      ai_context:
        instructions: Group by month. Return null when there is no previous month or its volume is zero; exclude
          partial months.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: (SUM(running_observation.measured_distance_m) / 1000.0) * 100
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","derive":{"type":"compose","expr":"run_volume_change_ratio * 100"},"subject_path":["fitness","training","volume_change"],"unit":"%"}'
    - name: run_volume_change_ratio
      description: Intermediate fractional month-over-month change in measured running volume.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: SUM(running_observation.measured_distance_m)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","window":{"base":"measured_run_distance_m_raw","offset":{"count":1,"granularity":"month","direction":"back"},"calculation":"percent_change"}}'
    - name: avg_power_w
      description: Per-activity average running power in watts for standalone runs with data.
      ai_context:
        instructions: Group by workout event and date. Do not aggregate across runs or compare unlike device algorithms
          directly.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(running_power_observation.avg_power_w)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","running","power"],"unit":"W"}'
    - name: lap_avg_cadence_spm
      description: Raw average cadence of one canonical running lap.
      ai_context:
        instructions: Group by activity and lap ordinal; do not add or average across laps.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(running_lap.avg_cadence_spm)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","running","lap_cadence"],"unit":"spm"}'
    - name: lap_avg_power_w
      description: Raw average power of one canonical running lap.
      ai_context:
        instructions: Group by activity and lap ordinal. Zero may be a missing-power outlier; do not aggregate across
          laps.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(running_lap.avg_power_w)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","running","lap_power"],"unit":"W"}'
    - name: lap_avg_pace_s_per_km
      description: Raw average pace of one canonical running lap.
      ai_context:
        instructions: Group by activity and lap ordinal; do not average lap paces across laps.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(running_lap.avg_pace_s_per_km)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","running","lap_pace"],"unit":"s/km"}'
    - name: measured_run_distance_m_raw
      description: Raw measured running distance in meters; helper for month-over-month change.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: SUM(running_observation.measured_distance_m)
    - name: avg_overnight_hrv_ms
      description: Mean of COROS official daily overnight HRV averages over valid wake dates; not a mean of raw
        HRV samples.
      ai_context:
        instructions: Use the provider normal range and date-specific evaluation to assess a day. Do not infer a
          universal low-HRV threshold from this average.
      expression:
        dialects:
        - dialect: STARROCKS
          expression: AVG(daily_hrv.hrv_avg_ms)
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.12","subject_path":["fitness","recovery","overnight_hrv"],"unit":"ms"}'
