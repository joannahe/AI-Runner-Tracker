version: 0.2.0.dev0
name: FitnessGoalOntology
description: Reusable ontology for running, race, body-composition and sleep goals; separates observations, capability
  evidence, goal criteria, progress reviews and human-approved decisions.
ontology:
- concept: Athlete
  type: EntityType
  identify_by:
  - id
  description: 'Layer 1 Runner: a fictional athlete identity. Physiological estimates are time-stamped observations,
    not permanent properties on this person.'
  relationships:
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
- concept: TrainingSession
  type: EntityType
  identify_by:
  - athlete_id
  - id
  description: Layer 1 RunSession or other completed workout, deduplicated across source activities. A rest day
    belongs in PlannedAction, not here.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: date
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: intent
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: sport
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: is_official_race
    roles:
    - concept: Boolean
      multiplicity: ManyToOne
  - name: race_format
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: performed_by
    description: An athlete performs a training session.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - An athlete performs a training session.
- concept: RaceEvent
  type: EntityType
  identify_by:
  - athlete_id
  - id
  description: A completed, verified race identified from an official TrainingSession. Race course distance
    must be verified separately; watch distance and HYROX format are not road-race distance.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: completed_on
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: course_distance_km
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: completed_as
    description: A verified race is a completed training session.
    roles:
    - concept: TrainingSession
    multiplicity: ManyToOne
- concept: SourceActivity
  type: EntityType
  identify_by:
  - id
  description: Layer 1 wearable source record; multiple records may describe the same completed session. COROS training_focus
    is a provider-generated primary session label, not time in a physiological zone.
  relationships:
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: distance_m
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: training_load
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: training_focus
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: records
    description: A source activity records a training session.
    roles:
    - concept: TrainingSession
    multiplicity: ManyToOne
    verbalizes:
    - A source activity records a training session.
- concept: RunningObservation
  type: EntityType
  identify_by:
  - athlete_id
  - analysis_revision
  - segment_ordinal
  - id
  description: Layer 1 Split or running leg at a particular analysis revision. A session may have several observations.
  relationships:
  - name: segment_ordinal
    roles:
    - concept: Integer
      multiplicity: OneToOne
  - name: analysis_revision
    roles:
    - concept: Integer
      multiplicity: OneToOne
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: date
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: measured_distance_m
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: duration_s
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: heart_rate_bpm
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: cadence_spm
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: part_of
    description: A running observation belongs to a training session.
    roles:
    - concept: TrainingSession
    multiplicity: ManyToOne
    verbalizes:
    - A running observation belongs to a training session.
- concept: SleepObservation
  type: EntityType
  identify_by:
  - athlete_id
  - source
  - id
  description: Layer 2 source sleep observation aligned to wake date, a recovery-context signal.
  relationships:
  - name: source
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: wake_date
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: sleep_minutes
    roles:
    - concept: Integer
      multiplicity: ManyToOne
  - name: score
    roles:
    - concept: Integer
      multiplicity: ManyToOne
  - name: observed_for
    description: A sleep observation belongs to an athlete.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - A sleep observation belongs to an athlete.
- concept: FitnessAssessment
  type: EntityType
  identify_by:
  - athlete_id
  - id
  description: Layer 2 provider estimate with observed time and metric code; its value does not become a permanent
    athlete property.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: metric_code
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: value
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: observed_at
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: assesses
    description: A fitness assessment describes an athlete.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - A fitness assessment describes an athlete.
  - name: unit
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: source
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: time_quality
    roles:
    - concept: String
      multiplicity: ManyToOne
- concept: GoalReviewWorkflow
  type: EntityType
  description: Layer 3 Agent procedure for reviewing any athlete goal. It has no warehouse row or automatic execution;
    its conceptual targets and uses_plan edges are explained in coaching_knowledge.yaml.
  relationships:
  - name: targets
    description: A goal review workflow targets a goal.
    roles:
    - concept: Goal
    multiplicity: ManyToOne
    verbalizes:
    - A goal review workflow targets a goal.
  - name: uses_plan
    description: A goal review workflow uses a action plan.
    roles:
    - concept: ActionPlan
    multiplicity: ManyToOne
    verbalizes:
    - A goal review workflow uses a action plan.
- concept: DailyTrainingLoad
  type: EntityType
  identify_by:
  - athlete_id
  - source
  - id
  description: Layer 2 provider-estimated training stress from recent sessions. Short-term load, long-term load
    and source ratio help review possible exercise-related fatigue; they are not a direct fatigue measurement or
    a diagnosis.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: source
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: id
    roles:
    - concept: Date
      multiplicity: OneToOne
  - name: short_term_load
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: long_term_load
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: load_ratio
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: status
    roles:
    - concept: String
      multiplicity: ManyToOne
- concept: OvernightHRV
  type: EntityType
  identify_by:
  - athlete_id
  - source
  - id
  description: COROS official overnight HRV assessment at the sleep wake date. The personal normal range and provider
    evaluation are stored as observed; this is not a medical diagnosis.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
    multiplicity: OneToOne
  - name: source
    roles:
    - concept: String
      multiplicity: OneToOne
    multiplicity: OneToOne
  - name: id
    roles:
    - concept: Date
      multiplicity: OneToOne
    multiplicity: OneToOne
  - name: avg_ms
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
    multiplicity: ManyToOne
  - name: normal_low_ms
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
    multiplicity: ManyToOne
  - name: normal_high_ms
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
    multiplicity: ManyToOne
  - name: baseline_ms
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
    multiplicity: ManyToOne
  - name: provider_evaluation
    roles:
    - concept: String
      multiplicity: ManyToOne
    multiplicity: ManyToOne
  - name: observed_for
    description: An overnight HRV assessment belongs to an athlete.
    roles:
    - concept: Athlete
      multiplicity: ManyToOne
    multiplicity: ManyToOne
    verbalizes:
    - An overnight HRV assessment belongs to an athlete.
- concept: RestingHeartRate
  type: EntityType
  identify_by:
  - athlete_id
  - source
  - id
  description: Layer 2 resting heart-rate observation; compare with the same athlete and device baseline, not a
    fixed population threshold.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: source
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: id
    roles:
    - concept: Date
      multiplicity: OneToOne
  - name: bpm
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: status
    roles:
    - concept: String
      multiplicity: ManyToOne
- concept: HeartRateZone
  type: EntityType
  identify_by:
  - athlete_id
  - scheme_id
  - id
  description: Layer 2 athlete-specific heart-rate boundary with scheme version; not time spent in zone. The public
    fixture does not supply per-sample zone duration.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: scheme_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: id
    roles:
    - concept: Integer
      multiplicity: OneToOne
  - name: lower_bpm
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: upper_bpm
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: valid_from
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: valid_to
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: scheme_method
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: assigned_to
    description: A heart-rate zone belongs to an athlete and a versioned zone scheme.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - A heart-rate zone belongs to an athlete and a versioned zone scheme.
- concept: Goal
  type: EntityType
  description: Versioned athlete-defined objective. A runner may have multiple concurrent goals; a revision does
    not overwrite an earlier version. Quantitative targets belong to GoalCriterion.
  relationships:
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: kind
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: set_by
    description: An athlete sets a goal.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - An athlete sets a goal.
  - name: goal_type
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: status
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: created_at
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: has_criterion
    description: A goal has one or more measurable or milestone criteria.
    roles:
    - concept: GoalCriterion
      multiplicity: ManyToOne
    verbalizes:
    - A goal has one or more measurable or milestone criteria.
  - name: version
    roles:
    - concept: Integer
      multiplicity: ManyToOne
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: title
    roles:
    - concept: String
      multiplicity: ManyToOne
  identify_by:
  - athlete_id
  - id
  - version
- concept: ActionPlan
  type: EntityType
  description: Layer 1 goal-specific, human-reviewable plan. It can contain running workouts, sleep routines, or
    other planned actions; it is not a recorded outcome or automatic prescription.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: version
    roles:
    - concept: Integer
      multiplicity: OneToOne
  - name: name
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: summary
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: status
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: approval_status
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: created_at
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: approved_at
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: revision_reason
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: for_goal
    description: A plan version serves exactly one versioned athlete goal.
    roles:
    - concept: Goal
      multiplicity: ManyToOne
    multiplicity: ManyToOne
  - name: owned_by
    description: A plan version belongs to one athlete, whether draft or approved.
    roles:
    - concept: Athlete
      multiplicity: ManyToOne
    multiplicity: ManyToOne
  identify_by:
  - athlete_id
  - id
  - version
- concept: PlannedAction
  type: EntityType
  description: A proposed or approved action within one versioned plan. A candidate workout match is not completion;
    only a manually verified event may fulfill the action.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: plan_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: plan_version
    roles:
    - concept: Integer
      multiplicity: OneToOne
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: scheduled_date
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: kind
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: planned_intensity
    description: Proposed low, moderate or high intensity; requires a structured planned_action field before querying.
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: title
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: target_duration_min
    roles:
    - concept: Integer
      multiplicity: ManyToOne
  - name: planning_status
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: completion_status
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: candidate_event_id
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: verified_event_id
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: match_method
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: match_reviewed_at
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: source
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: in_plan
    description: A planned action belongs to one versioned plan.
    roles:
    - concept: ActionPlan
      multiplicity: ManyToOne
    multiplicity: ManyToOne
  - name: fulfilled_by
    description: Only a reviewed, verified workout may fulfill a planned action.
    roles:
    - concept: TrainingSession
      multiplicity: ManyToOne
    multiplicity: ManyToOne
  identify_by:
  - athlete_id
  - plan_id
  - plan_version
  - id
- concept: Capability
  type: EntityType
  description: Dated assessment of one running-capability type, backed by cited observations. Status distinguishes
    a provider baseline, descriptive evidence and an observed outcome; no universal score is computed.
  relationships:
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: kind
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: belongs_to
    description: A capability assessment concerns an athlete.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - A capability assessment concerns an athlete.
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: assessment_version
    roles:
    - concept: Integer
      multiplicity: OneToOne
  - name: review_date
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: status
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: confidence
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: method_version
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: rationale
    roles:
    - concept: String
      multiplicity: ManyToOne
  identify_by:
  - athlete_id
  - id
  - assessment_version
- concept: MetricEvidence
  type: EntityType
  description: One cited metric or versioned pace-zone boundary supporting a dated capability review. Source, comparability
    and observed value are retained; the semantic metric formula is unchanged.
  relationships:
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: metric_name
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: evidence_kind
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: observed_on
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: confidence
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: concerns
    description: Metric evidence concerns an athlete.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - Metric evidence concerns an athlete.
  - name: indicates
    description: Metric evidence may indicate a capability when comparison conditions are satisfied.
    roles:
    - concept: Capability
    multiplicity: ManyToOne
    verbalizes:
    - Metric evidence may indicate a capability when comparison conditions are satisfied.
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: assessment_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: assessment_version
    roles:
    - concept: Integer
      multiplicity: OneToOne
  - name: source_dataset
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: source_record_id
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: observed_value
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: unit
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: comparability_status
    roles:
    - concept: String
      multiplicity: ManyToOne
  identify_by:
  - athlete_id
  - assessment_id
  - assessment_version
  - id
- concept: RecoveryState
  type: EntityType
  description: Saved daily, evidence-backed recovery review. A review with inadequate personal baselines is explicitly
    insufficient_evidence; COROS recovery remains a separate provider estimate.
  relationships:
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: review_date
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: for_athlete
    description: A recovery review concerns an athlete.
    roles:
    - concept: Athlete
    multiplicity: ManyToOne
    verbalizes:
    - A recovery review concerns an athlete.
  - name: considers_sleep
    description: A recovery review considers available sleep observations.
    roles:
    - concept: SleepObservation
    multiplicity: ManyToOne
    verbalizes:
    - A recovery review considers available sleep observations.
  - name: considers_hrv
    description: A recovery review may consider the dated COROS overnight HRV assessment.
    roles:
    - concept: OvernightHRV
      multiplicity: ManyToOne
    multiplicity: ManyToOne
    verbalizes:
    - A recovery review may consider the dated COROS overnight HRV assessment.
  - name: considers_resting_hr
    description: A recovery review considers resting heart rate.
    roles:
    - concept: RestingHeartRate
    multiplicity: ManyToOne
    verbalizes:
    - A recovery review considers resting heart rate.
  - name: considers_load
    description: A recovery review considers daily training load.
    roles:
    - concept: DailyTrainingLoad
    multiplicity: ManyToOne
    verbalizes:
    - A recovery review considers daily training load.
  - name: considers_provider_estimate
    description: A recovery review may consider a provider recovery estimate.
    roles:
    - concept: ProviderRecoveryEstimate
    multiplicity: ManyToOne
    verbalizes:
    - A recovery review may consider a provider recovery estimate.
  - name: considers_workout
    description: A recovery review considers the recent workout and its duration.
    roles:
    - concept: TrainingSession
      multiplicity: ManyToOne
    verbalizes:
    - A recovery review considers the recent workout and its duration.
  - name: considers_running_intensity
    description: A recovery review considers measured pace and heart rate as workout intensity context.
    roles:
    - concept: RunningObservation
      multiplicity: ManyToOne
    verbalizes:
    - A recovery review considers measured pace and heart rate as workout intensity context.
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: assessment_version
    roles:
    - concept: Integer
      multiplicity: OneToOne
  - name: status
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: method_version
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: sleep_valid_days_7
    roles:
    - concept: Integer
      multiplicity: ManyToOne
  - name: rhr_valid_days_7
    roles:
    - concept: Integer
      multiplicity: ManyToOne
  - name: sleep_valid_days_42
    roles:
    - concept: Integer
      multiplicity: ManyToOne
  identify_by:
  - athlete_id
  - id
  - assessment_version
- concept: RecoveryEvidence
  type: EntityType
  identify_by:
  - athlete_id
  - assessment_id
  - assessment_version
  - id
  description: One dated source observation evaluated against a named review rule; includes baseline coverage and
    a source record reference.
  relationships:
  - name: athlete_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: assessment_id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: assessment_version
    roles:
    - concept: Integer
      multiplicity: OneToOne
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: source_dataset
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: source_record_id
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: source_date
    roles:
    - concept: Date
      multiplicity: ManyToOne
  - name: metric_code
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: observed_value
    roles:
    - concept: Decimal
      multiplicity: ManyToOne
  - name: unit
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: evaluation_status
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: valid_prior_days
    roles:
    - concept: Integer
      multiplicity: ManyToOne
  - name: baseline_days
    roles:
    - concept: Integer
      multiplicity: ManyToOne
  - name: belongs_to
    description: Evidence belongs to one saved recovery review.
    roles:
    - concept: RecoveryState
    multiplicity: ManyToOne
    verbalizes:
    - Evidence belongs to one saved recovery review.
  - name: evaluated_with
    description: Evidence is evaluated with one versioned recovery rule.
    roles:
    - concept: RecoveryRule
    multiplicity: ManyToOne
    verbalizes:
    - Evidence is evaluated with one versioned recovery rule.
- concept: PaceZone
  type: EntityType
  description: Athlete-specific, versioned training-pace boundary. Faster comparable boundaries over time can support
    a running-capability interpretation; a single profile is not an ability score and this is not a recovery input.
  relationships:
  - name: athlete_id
