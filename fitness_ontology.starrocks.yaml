ontology_mappings:
- name: fitness
  semantic_model:
    name: fitness_analysis
    description: Synthetic running and fitness analytics example. No real athlete data is included.
    ai_context:
      instructions: Use only fictional demo athletes. Deduplicate workout copies; separate measured and rule-reference
        pace, official and watch time, and team and individual outcomes. Do not expose names, exact birth dates,
        or body measurements.
    datasets:
    - description: Fictional athlete identifier, recorded gender, and time zone. No names or birth dates are required.
      fields:
      - expression:
          dialects:
          - dialect: STARROCKS
            expression: athlete_id
        label: Athlete id
        name: athlete_id
      - expression:
          dialects:
          - dialect: STARROCKS
            expression: gender_code
        label: Gender code
        name: gender_code
      - expression:
          dialects:
          - dialect: STARROCKS
            expression: timezone_name
        label: Timezone name
        name: timezone_name
      name: athlete
      primary_key:
      - athlete_id
      source: fitness_demo.athlete
    - custom_extensions:
      - data: '{"v":"1.12","requires":["time_dimension"],"time_dimension":"event_date"}'
        vendor_name: DATUS
      description: One real workout after cross-platform deduplication, including race classification and the active
        analysis revision.
      fields:
