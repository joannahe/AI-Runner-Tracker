  - name: supported_by
    description: An inferred state cites metric evidence.
    roles:
    - concept: MetricEvidence
    multiplicity: ManyToOne
    verbalizes:
    - An inferred state cites metric evidence.
  identify_by:
  - id
- concept: Recommendation
  type: EntityType
  description: Layer 3 evidence-backed, human-reviewable suggestion for a goal or its planned action. Examples vary
    by goal; the ontology does not automatically prescribe or execute an action.
