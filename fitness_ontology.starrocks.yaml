- concept: InferredState
  type: EntityType
  description: Layer 3 conceptual review flag, not a medical diagnosis or a persisted assertion. Codes include LoadRecoveryReview,
    OvertrainingRisk (high COROS load review only), WeeklyMileageIncreaseReview, PolarizedHighIntensityReview (weekly
    session-count share), CompromisedRecovery (biometric review), PostRaceRecoveryReview, HardEasySequenceReview,
    ReadyToProgress, GoalProgressReview, and disabled
    CardiacDriftDetected. Their evidence gates and configurable thresholds live in coaching_knowledge.yaml; DOSI
    does not execute these rules.
  relationships:
  - name: id
    roles:
    - concept: String
      multiplicity: OneToOne
  - name: code
    roles:
    - concept: String
      multiplicity: ManyToOne
  - name: detected_on
