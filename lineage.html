<html lang="en">
<head>
<meta charset="utf-8">

<title>dosi lineage</title>
<style>
  :root {
    --paper: #f5f7f6; --panel: #ffffff; --ink: #16212b; --muted: #5f6c75;
    --line: #dde3e2; --rule: #eef2f1; --hit: #fff3d6;
    --table: #7a6142; --dataset: #1f6fb2; --concept: #6d4aae; --atomic: #157f6a; --derived: #b06a12;
    --warn: #a32b2b; --info: #1f6fb2; --neutral: #5f6c75;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101820; --panel: #17212a; --ink: #e6edf1; --muted: #93a3ae;
      --line: #27343d; --rule: #1e2a33; --hit: #4a3a12;
      --table: #c39c6b; --dataset: #6bb4ec; --concept: #b295e8; --atomic: #5cc2a8; --derived: #e0a45f;
      --warn: #e98484; --info: #6bb4ec; --neutral: #93a3ae;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.45 var(--font); color: var(--ink); background: var(--paper);
         display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--dataset); outline-offset: 2px; }

  /* header: the model names itself, everything else is a control */
  header { display: flex; align-items: baseline; gap: 20px; padding: 10px 16px 9px;
           border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; line-height: 1.2; margin: 0; font-weight: 600; letter-spacing: -.01em; }
  header .sub { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  header .sub b { font-weight: 500; color: var(--ink); }
  .tabs { display: flex; gap: 2px; }
  .tabs button { border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted);
                 padding: 3px 2px; margin-right: 12px; cursor: pointer; font: inherit; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--concept); }
  input[type=search] { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 5px;
                       width: 200px; background: var(--panel); color: var(--ink); }
  input[type=search]::placeholder { color: var(--muted); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 11px; margin-left: auto; }
  .legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
  .language { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
  .language button { font: inherit; color: var(--muted); background: none; border: 0; border-radius: 4px; padding: 3px 7px; cursor: pointer; }
  .language button.on { background: var(--paper); color: var(--ink); font-weight: 600; }

  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; overflow: hidden; cursor: grab; background: var(--paper); }
  #stage.drag { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; }

  /* inspector: a spec sheet, not a stack of cards */
  aside { width: 372px; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 16px 28px; }
  aside h2 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -.01em; word-break: break-word; }
  aside .kind { color: var(--muted); font-size: 12px; margin: 3px 0 14px; }
  aside .kind code { font-family: var(--mono); font-size: 11px; }
  aside h3 { font-size: 12px; margin: 16px 0 6px; color: var(--muted); font-weight: 600;
             padding-top: 8px; border-top: 1px solid var(--rule); }
  aside dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
  aside dt { color: var(--muted); }
  aside dd { margin: 0; font-family: var(--mono); font-size: 12px; word-break: break-word; }
  aside pre { background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 8px 9px;
              font: 11px/1.5 var(--mono); white-space: pre-wrap; margin: 6px 0 2px; }
  aside table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 4px 0 2px; }
  aside th, aside td { text-align: left; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--rule); vertical-align: top; font-family: var(--mono); }
  aside th { color: var(--muted); font-family: var(--font); font-weight: 500; }
  aside .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
  aside .chip { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 999px;
                background: var(--paper); border: 1px solid var(--line); color: var(--ink); }
  aside .edge { display: block; font-size: 12px; padding: 3px 0; cursor: pointer; color: var(--ink); text-decoration: none; }
  aside .edge:hover { text-decoration: underline; }
  aside .edge b { font-weight: 400; color: var(--muted); }
  aside .edge .nm { font-family: var(--mono); }
  aside .empty { color: var(--muted); }
  .badge { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-right: 4px; color: #fff; }
  .badge.warn { background: var(--warn); } .badge.info { background: var(--info); } .badge.neutral { background: var(--neutral); }

  /* graph */
  .lane-title { font-size: 12px; fill: var(--muted); font-weight: 500; }
  .lane-rule { stroke: var(--line); }
  .node { cursor: pointer; }
  .node rect.box { fill: var(--panel); stroke-width: 1.25; }
  .node.physical_table rect.box { stroke: var(--table); }
  .node.dataset rect.box { stroke: var(--dataset); }
  .node.entity rect.box { stroke: var(--concept); }
  .node.entity.denormalized rect.box, .node.entity.unmapped rect.box { stroke-dasharray: 5 3; }
  .node.entity.unmapped rect.box { stroke: var(--muted); }
  .node.metric_atomic rect.box { stroke: var(--atomic); }
  .node.metric_derived rect.box { stroke: var(--derived); }
  .node text { font-size: 12.5px; fill: var(--ink); pointer-events: none; }
  .node .sub { font-size: 10.5px; fill: var(--muted); font-family: var(--mono); }
  .node.dim { opacity: .24; }
  .node.sel rect.box { stroke-width: 2.5; }
  .node.hit rect.box { fill: var(--hit); }
  .node .bg { font-size: 9.5px; fill: var(--panel); font-weight: 600; }
  .node .bgr.warn { fill: var(--warn); } .node .bgr.info { fill: var(--info); } .node .bgr.neutral { fill: var(--neutral); }
  .edge { fill: none; stroke-width: 1.3; stroke: var(--muted); opacity: .85; }
  .edge.reads_table { stroke: var(--table); }
  .edge.join { stroke: var(--dataset); stroke-dasharray: 5 4; }
  .edge.aggregates { stroke: var(--atomic); }
  .edge.derive_base, .edge.window_base, .edge.window_second, .edge.compose_member { stroke: var(--derived); }
  .edge.window_second { stroke-dasharray: 2 3; }
  .edge.mapping { stroke: var(--concept); stroke-dasharray: 3 3; opacity: .6; }
  .edge.relationship { stroke: var(--concept); }
  /* the one loud thing on the page: the path that separates two metrics
     whose SQL is identical */
  .edge.grain { stroke: var(--concept); stroke-width: 2.5; opacity: 1; }
  .edge.dim { opacity: .07; }
  .edge.sel { stroke-width: 2.8; }
  .elabel { font-size: 10.5px; fill: var(--muted); pointer-events: none; }
  .elabel.route { fill: var(--concept); font-family: var(--mono); font-size: 10px; }
  .chip-bg { fill: var(--panel); stroke: var(--concept); stroke-width: 1; }
  .elabel.dim, .chip-bg.dim { opacity: .08; }
  .card-prop { font-size: 10.5px; fill: var(--muted); font-family: var(--mono); }
  .card-sep { stroke: var(--rule); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

"relationship","source":"concept:GoalProgressEvidence","target":"concept:GoalProgressAssessment","name":"supports","role":"supports","multiplicity":"ManyToOne","description":"Cited evidence supports one saved criterion review.","realized_by":["join:goal_progress_evidence_to_assessment"],"no_join":false},{"id":"subtype:CorosHighFocusRunActivity->SourceActivity","kind":"subtype","source":"concept:CorosHighFocusRunActivity","target":"concept:SourceActivity","rule":"SourceActivity.source == 'coros' AND SourceActivity.sport == 'running' AND SourceActivity.training_focus IN ('Threshold', 'VO2 Max', 'Anaerobic')","flag":"activity.coros_high_focus_run_activity"},{"id":"subtype:HighMileageGrowthWeek->WeeklyRunningDistance","kind":"subtype","source":"concept:HighMileageGrowthWeek","target":"concept:WeeklyRunningDistance","rule":"WeeklyRunningDistance.growth_ratio > 0.1","flag":"weekly_running_distance.high_mileage_growth_week"},{"id":"subtype:HighLoadDay->DailyTrainingLoad","kind":"subtype","source":"concept:HighLoadDay","target":"concept:DailyTrainingLoad","rule":"DailyTrainingLoad.source == 'coros' AND DailyTrainingLoad.load_ratio > 1.5","flag":"daily_training_load.high_load_day"},{"id":"subtype:LowLoadDay->DailyTrainingLoad","kind":"subtype","source":"concept:LowLoadDay","target":"concept:DailyTrainingLoad","rule":"DailyTrainingLoad.source == 'coros' AND DailyTrainingLoad.load_ratio \u003c 0.8","flag":"daily_training_load.low_load_day"}]}}</script>
<script>
(() => {
'use strict';
const G = JSON.parse(document.getElementById('graph').textContent);
const ONT = G.ontology || null;
const SVG_NS = 'http://www.w3.org/2000/svg';
// Defined up here because the header below writes markup: a `const` is in
// its temporal dead zone until its own line runs.
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const translations = {
  en: { Lineage:'Lineage', Concepts:'Concepts', 'Find a name':'Find a name', empty:'Select a node to see where it comes from. Hovering traces its neighbours; typing a name highlights it.', 'Read through the':'Read through the', ontology:'ontology', mode:'mode', 'Graph contract':'Graph contract', 'physical table':'physical table', dataset:'dataset', concept:'concept', 'atomic metric':'atomic metric', 'derived metric':'derived metric', 'Physical table':'Physical table', Dataset:'Dataset', Concept:'Concept', 'Atomic metric':'Atomic metric', 'Derived metric':'Derived metric', 'on its own table':'on its own table', 'denormalized onto another table':'denormalized onto another table', 'not mapped to any column':'not mapped to any column', Source:'Source', Fields:'Fields', Properties:'Properties', Unmapped:'Unmapped', Expression:'Expression', Dimensions:'Dimensions', Semantics:'Semantics', Window:'Window', Derive:'Derive', Params:'Params', Extensions:'Extensions', Edges:'Edges', none:'none', 'No such node.':'No such node.', 'Nothing recommended. Keys, foreign keys and aggregated columns are left out; any of them still works in an explicit group-by.':'Nothing recommended. Keys, foreign keys and aggregated columns are left out; any of them still works in an explicit group-by.' },
  zh: { Lineage:'血缘', Concepts:'概念', 'Find a name':'搜索名称', empty:'选择节点查看来源。悬停可追踪相邻节点，输入名称可高亮匹配项。', 'Read through the':'通过', ontology:'本体查看', mode:'模式', 'Graph contract':'图谱契约', 'physical table':'物理表', dataset:'数据集', concept:'概念', 'atomic metric':'原子指标', 'derived metric':'衍生指标', 'Physical table':'物理表', Dataset:'数据集', Concept:'概念', 'Atomic metric':'原子指标', 'Derived metric':'衍生指标', 'on its own table':'映射到独立表', 'denormalized onto another table':'映射到其他表的宽表字段', 'not mapped to any column':'尚未映射到字段', Source:'来源', Fields:'字段', Properties:'属性', Unmapped:'未映射', Expression:'表达式', Dimensions:'维度', Semantics:'语义', Window:'时间窗口', Derive:'衍生定义', Params:'参数', Extensions:'扩展', Edges:'关系', none:'无', 'No such node.':'找不到该节点。', 'Nothing recommended. Keys, foreign keys and aggregated columns are left out; any of them still works in an explicit group-by.':'暂无推荐维度。主键、外键和已聚合字段未列出，但仍可在显式分组中使用。', reads_table:'读取表', join:'关联', aggregates:'聚合', derive_base:'衍生基础', mapping:'映射', relationship:'关系', grain:'粒度', 'model name':'模型名称', measure:'度量', via:'经由', identity:'标识', 'key columns':'键字段', datasets:'数据集', 'physical_columns':'物理字段', fields:'字段', source:'来源', name:'名称', label:'标签', expr_sql:'SQL 表达式', domain:'值域', 'in':'入', out:'出' }
};
let language = 'en';
try { language = localStorage.getItem('fitness_lineage_language') === 'zh' ? 'zh' : 'en'; } catch (_) {}
const tr = key => translations[language][key] || translations.en[key] || key;

// ---- model -------------------------------------------------------------
// One index over both the plain projection and the overlay, so hover, the
// detail panel and the filter never care which half a node came from.
const nodes = new Map();
G.nodes.forEach(n => nodes.set(n.id, { ...n, side: 'v2' }));
if (ONT) ONT.nodes.forEach(n => nodes.set(n.id, { ...n, side: 'ont', layer: -1 }));
const edges = G.edges.map(e => ({ ...e, side: 'v2' }))
  .concat(ONT ? ONT.edges.map(e => ({ ...e, side: 'ont' })) : [])
  // The grain of an ontology-derived metric is semantics, so the contract
  // keeps it on the metric node. Drawn here as an edge anyway: it is the
  // one thing that separates two metrics with identical SQL, and a reader
  // has to see it. Derived, not part of `ontology.edges`.
  .concat(G.nodes.flatMap(n => {
    const c = n.concept;
    if (!c || !c.group_by) return [];
    return [{
      id: `grain:concept:${c.group_by}->${n.id}`, kind: 'grain', derived: true,
      source: `concept:${c.group_by}`, target: n.id, via: c.via || [],
      realized_by: c.realized_by || [], measure: c.measure,
    }];
  }));
const outOf = new Map(), inOf = new Map();
edges.forEach(e => {
  (outOf.get(e.source) || outOf.set(e.source, []).get(e.source)).push(e);
  (inOf.get(e.target) || inOf.set(e.target, []).get(e.target)).push(e);
});
const displayName = n => (n.concept && n.concept.path) || n.label || n.name;

// ---- header ------------------------------------------------------------
document.getElementById('model').textContent = G.model;
if (ONT) document.getElementById('tab-concepts').hidden = false;
function renderHeader() {
  document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
  document.title = language === 'zh' ? 'DOSI 血缘图' : 'DOSI lineage';
  document.querySelector('[data-view="lineage"]').textContent = tr('Lineage');
  document.querySelector('[data-view="concepts"]').textContent = tr('Concepts');
  const search = document.getElementById('filter');
  search.placeholder = tr('Find a name'); search.setAttribute('aria-label', tr('Find a name'));
  document.getElementById('meta').innerHTML = ONT
    ? (language === 'zh' ? `通过 <b>${esc(ONT.name)}</b> ${tr('ontology')} · ${esc(G.mode || 'default')} ${tr('mode')}` : `Read through the <b>${esc(ONT.name)}</b> ontology, ${esc(G.mode || 'default')} mode`)
    : `${tr('Graph contract')} v${G.version}, ${esc(G.mode || 'default')} ${tr('mode')}`;
  const kinds = [['reads_table','table'],['join','dataset'],['aggregates','atomic'],['derive_base','derived']];
  if (ONT) kinds.push(['mapping','concept'],['relationship','concept'],['grain','concept']);
  document.getElementById('legend').innerHTML = kinds
    .map(([k, c]) => `<span><i style="border-color:var(--${c})"></i>${tr(k)}</span>`).join('');
  for (const code of ['en', 'zh']) {
    const button = document.getElementById('language-' + code);
    button.classList.toggle('on', code === language);
    button.setAttribute('aria-pressed', String(code === language));
  }
}
renderHeader();

// ---- layout: lanes -----------------------------------------------------
// Lane order is the contract's `layers`, with the concept lane inserted
// between dataset and atomic metric when an overlay exists. The derived
// lane is not one column: a derived metric sits one column to the right of
// the rightmost metric it is built from, so a compose chain reads left to
// right instead of collapsing into a single column of metrics wired to
// each other. Nodes inside a column are ordered by the barycenter of their
// neighbours in the previous column (a few sweeps both ways), which is
// what keeps a wide column from turning into a bundle of crossings.
const NODE_W = 210, NODE_H = 34, LANE_GAP = 110, ROW_GAP = 12;
function laneOf(n) { return n.side === 'ont' ? 'concept' : n.kind; }

// How far into the derive chain each derived metric sits: 0 when it is
// built only from atomic metrics, otherwise one past its deepest derived
// input. Only metric-to-metric edges count — the overlay's `grain` edge
// points at semantics, not at a value this metric is computed from.
function deriveDepth() {
  const isDerived = id => { const n = nodes.get(id); return !!n && n.kind === 'metric_derived'; };
  const ids = [...nodes.keys()].filter(isDerived);
  const consumers = new Map(), pending = new Map(), depth = new Map();
  ids.forEach(id => {
    const up = (inOf.get(id) || []).map(e => e.source).filter(isDerived);
    pending.set(id, up.length);
    depth.set(id, 0);
    up.forEach(u => (consumers.get(u) || consumers.set(u, []).get(u)).push(id));
  });
  // Longest path by topological order. A validated model cannot hold a
  // derive cycle, but a graph is a graph: whatever a cycle leaves unsettled
  // goes into one column past everything else rather than being dropped.
  const queue = ids.filter(id => pending.get(id) === 0);
  for (let i = 0; i < queue.length; i++) {
    const id = queue[i];
    (consumers.get(id) || []).forEach(c => {
      depth.set(c, Math.max(depth.get(c), depth.get(id) + 1));
      pending.set(c, pending.get(c) - 1);
      if (pending.get(c) === 0) queue.push(c);
    });
  }
  const settled = new Set(queue);
  let last = 0;
  settled.forEach(id => { last = Math.max(last, depth.get(id)); });
  ids.forEach(id => { if (!settled.has(id)) depth.set(id, last + 1); });
  return depth;
}

function layoutLineage() {
  const lanes = G.layers.map(l => ({ kind: l.kind, label: l.label }));
  if (ONT) lanes.splice(2, 0, { kind: 'concept', label: 'concept' });
  const depth = deriveDepth();
  const deriveCols = 1 + (depth.size ? Math.max(...depth.values()) : 0);
  const cols = [], colLabel = [], laneStart = new Map();
  lanes.forEach(lane => {
    laneStart.set(lane.kind, cols.length);
    const n = lane.kind === 'metric_derived' ? deriveCols : 1;
    for (let d = 0; d < n; d++) {
      cols.push([]);
      colLabel.push(n > 1 ? `${lane.label} ${d + 1}` : lane.label);
    }
  });
  const colOf = new Map();
  nodes.forEach(n => {
    const lane = laneOf(n);
    const ci = laneStart.get(lane) + (lane === 'metric_derived' ? depth.get(n.id) : 0);
    cols[ci].push(n.id);
    colOf.set(n.id, ci);
  });
  const pos = new Map();
  cols.forEach(c => c.forEach((id, i) => pos.set(id, i)));
  const nb = (id, dir) => (dir > 0 ? inOf : outOf).get(id) || [];
  const sweep = (dir) => {
    const order = dir > 0 ? cols.keys() : [...cols.keys()].reverse();
    for (const ci of order) {
      const col = cols[ci];
      const bary = new Map();
      col.forEach(id => {
        const ns = nb(id, dir).map(e => dir > 0 ? e.source : e.target)
          .filter(o => colOf.get(o) !== ci);
        bary.set(id, ns.length ? ns.reduce((s, o) => s + pos.get(o), 0) / ns.length : pos.get(id));
      });
      col.sort((a, b) => bary.get(a) - bary.get(b) || pos.get(a) - pos.get(b));
      col.forEach((id, i) => pos.set(id, i));
    }
  };
  for (let i = 0; i < 4; i++) { sweep(+1); sweep(-1); }
  const xy = new Map();
  let x = 0;
  const laneX = [];
  cols.forEach((col) => {
    const w = col.reduce((m, id) => Math.max(m, nodeWidth(nodes.get(id))), NODE_W);
    laneX.push(x);
    let y = 30;
    col.forEach(id => { xy.set(id, { x, y, w, h: NODE_H }); y += NODE_H + ROW_GAP; });
    x += w + LANE_GAP;
  });
  return { cols, colLabel, xy, laneX };
}

// ---- layout: concept view ------------------------------------------------
// Entity cards on a ring, properties folded in; the ontology is small by
// nature (an ontology with fifty entities is a modelling problem, not a
// rendering one), so a ring reads better than a force layout and is
// deterministic.
const CARD_W = 220, PROP_H = 14, MAX_PROPS = 8;
function layoutConcepts() {
  const ids = ONT.nodes.map(n => n.id);
  const xy = new Map();
  const n = ids.length || 1;
  const heights = ids.map(id => 30 + Math.min(nodes.get(id).properties.length, MAX_PROPS + 1) * PROP_H + 8);
  const R = Math.max(260, n * 70);
  ids.forEach((id, i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    xy.set(id, { x: R + R * Math.cos(a) * 1.4, y: R + R * Math.sin(a), w: CARD_W, h: heights[i] });
  });
  return { xy };
}

// ---- rendering -----------------------------------------------------------
const root = document.getElementById('root');
const stage = document.getElementById('stage');
const svg = document.getElementById('svg');
let view = 'lineage', selected = null, hovered = null, filter = '';
let drawn = { xy: new Map(), nodeEls: new Map(), edgeEls: [], labelEls: [] };

const el = (tag, attrs = {}, cls) => {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (cls) e.setAttribute('class', cls);
  return e;
};
const right = b => ({ x: b.x + b.w, y: b.y + b.h / 2 });
const left = b => ({ x: b.x, y: b.y + b.h / 2 });
const curve = (a, b) => { const dx = Math.max(40, (b.x - a.x) / 2); return `M${a.x},${a.y}C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`; };
const arc = (a, b, bulge) => `M${a.x},${a.y}C${a.x - bulge},${a.y} ${b.x - bulge},${b.y} ${b.x},${b.y}`;

// What an edge says on the canvas. The lineage view labels only what the
// node text cannot carry — a grain path and a compose coefficient;
// relationship roles and measured properties are on the concept view and in the panel,
// and drawing them here piles four labels onto one metric.
function edgeLabel(e, forView) {
  if (e.kind === 'grain' && e.via && e.via.length) return e.via.map(v => v.split('.').pop()).join(' › ');
  if (e.kind === 'compose_member' && e.label) return e.label;
  // Role only on the canvas: two roles between the same pair is the case
  // worth seeing, and the multiplicity is one click away in the panel.
  if (forView === 'concepts' && e.kind === 'relationship') return e.role;
  if (forView === 'panel' && e.kind === 'relationship') return e.role;
  if (forView === 'panel' && e.kind === 'grain' && e.measure) return e.measure;
  return '';
}
// Wide enough for the name and its badges; a long concept spelling must
// not spill past its box.
const textWidth = s => [...s].reduce((w, c) => w + (c.charCodeAt(0) > 255 ? 12 : 6.6), 0);
function nodeWidth(n) {
  const badges = (n.badges || []).reduce((w, b) => w + b.text.length * 6 + 12, 0) + (n.side === 'ont' ? 60 : 0);
  return Math.min(360, Math.max(NODE_W, 24 + textWidth(displayName(n)) + badges));
}

function nodeEl(n, b, withProps) {
  const g = el('g', { transform: `translate(${b.x},${b.y})` }, `node ${n.kind}${n.mapping ? ' ' + n.mapping : ''}`);
  g.dataset.id = n.id;
  g.appendChild(el('rect', { width: b.w, height: b.h, rx: 5 }, 'box'));
  // A concept-spelled metric keeps its model name underneath: the graph
  // says what the ontology calls it, the SQL still says the other thing.
  const twoLine = !!(n.concept && n.concept.path);
  const t = el('text', { x: 11, y: twoLine ? 17 : 21 });
  t.textContent = displayName(n);
  g.appendChild(t);
  if (twoLine) {
    const s = el('text', { x: 11, y: 28 }, 'sub');
    s.textContent = n.name;
    g.appendChild(s);
  }
  const badges = (n.badges || []).slice();
  if (n.side === 'ont') badges.push({ text: n.mapping === 'table' ? n.dataset : n.mapping, tone: n.mapping === 'table' ? 'info' : 'neutral' });
  let bx = b.w - 8;
  badges.slice().reverse().forEach(bd => {
    const w = bd.text.length * 6 + 8;
    bx -= w + 4;
    g.appendChild(el('rect', { x: bx, y: 9, width: w, height: 15, rx: 3 }, `bgr ${bd.tone}`));
    const bt = el('text', { x: bx + 4, y: 20 }, 'bg'); bt.textContent = bd.text; g.appendChild(bt);
  });
  if (withProps && n.properties) {
    g.appendChild(el('line', { x1: 0, y1: 30, x2: b.w, y2: 30 }, 'card-sep'));
    n.properties.slice(0, MAX_PROPS).forEach((p, i) => {
      const pt = el('text', { x: 10, y: 44 + i * PROP_H }, 'card-prop');
      pt.textContent = `${p.name}: ${p.concept}${p.derived ? ' ƒ' : ''}${p.field ? '' : ' ∅'}`;
      g.appendChild(pt);
    });
    if (n.properties.length > MAX_PROPS) {
      const more = el('text', { x: 10, y: 44 + MAX_PROPS * PROP_H }, 'card-prop');
      more.textContent = `+${n.properties.length - MAX_PROPS} more`; g.appendChild(more);
    }
  }
  g.addEventListener('click', ev => { ev.stopPropagation(); select(n.id); });
  g.addEventListener('mouseenter', () => { hovered = n.id; restyle(); });
  g.addEventListener('mouseleave', () => { hovered = null; restyle(); });
  return g;
}

function draw() {
  root.innerHTML = '';
  drawn = { xy: new Map(), nodeEls: new Map(), edgeEls: [], labelEls: [] };
  const edgeLayer = el('g'), nodeLayer = el('g'), labelLayer = el('g');
  let visibleEdges;
  if (view === 'lineage') {
    const { cols, colLabel, xy, laneX } = layoutLineage();
    drawn.xy = xy;
    colLabel.forEach((label, i) => {
      const t = el('text', { x: laneX[i], y: 12 }, 'lane-title');
      t.textContent = `${tr(label.replace(/ \d+$/, ''))}${label.match(/ \d+$/)?.[0] || ''} (${cols[i].length})`;
      root.appendChild(t);
      root.appendChild(el('line', { x1: laneX[i], y1: 20, x2: laneX[i] + 120, y2: 20 }, 'lane-rule'));
    });
    visibleEdges = edges;
    nodes.forEach(n => { const g = nodeEl(n, xy.get(n.id), false); nodeLayer.appendChild(g); drawn.nodeEls.set(n.id, g); });
  } else {
    const { xy } = layoutConcepts();
    drawn.xy = xy;
    visibleEdges = edges.filter(e => e.kind === 'relationship');
    ONT.nodes.forEach(o => { const n = nodes.get(o.id); const g = nodeEl(n, xy.get(n.id), true); nodeLayer.appendChild(g); drawn.nodeEls.set(n.id, g); });
  }
  // Parallel edges between one pair get spread so `departs_from` and
  // `arrives_at` never overprint each other.
  const pairCount = new Map(), pairSeen = new Map();
  visibleEdges.forEach(e => { const k = [e.source, e.target].sort().join('|'); pairCount.set(k, (pairCount.get(k) || 0) + 1); });
  visibleEdges.forEach(e => {
    const a = drawn.xy.get(e.source), b = drawn.xy.get(e.target);
    if (!a || !b) return;
    const k = [e.source, e.target].sort().join('|');
    const idx = pairSeen.get(k) || 0; pairSeen.set(k, idx + 1);
    const spread = (idx - (pairCount.get(k) - 1) / 2) * 14;
    let d, mid;
    if (view === 'concepts') {
      const ca = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, cb = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
      const mx = (ca.x + cb.x) / 2, my = (ca.y + cb.y) / 2;
      const nx = -(cb.y - ca.y), ny = cb.x - ca.x, len = Math.hypot(nx, ny) || 1;
      const off = 40 + spread * 3;
      const cx = mx + nx / len * off, cy = my + ny / len * off;
      d = `M${ca.x},${ca.y}Q${cx},${cy} ${cb.x},${cb.y}`;
      mid = { x: (ca.x + 2 * cx + cb.x) / 4, y: (ca.y + 2 * cy + cb.y) / 4 };
    } else if (a.x === b.x) {
      const p = left(a), q = left(b); p.y += spread; q.y += spread;
      d = arc(p, q, 50 + Math.abs(idx) * 12);
      mid = { x: p.x - 40, y: (p.y + q.y) / 2 };
    } else {
      const p = a.x < b.x ? right(a) : left(a), q = a.x < b.x ? left(b) : right(b);
      p.y += spread; q.y += spread;
      d = curve(p, q);
      mid = { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 - 4 };
    }
    const path = el('path', { d }, `edge ${e.kind}`);
    path.dataset.source = e.source; path.dataset.target = e.target;
    const title = el('title'); title.textContent = `${e.kind}${e.name ? ' ' + e.name : ''}`; path.appendChild(title);
    edgeLayer.appendChild(path);
    drawn.edgeEls.push({ e, path });
    const lbl = edgeLabel(e, view);
    if (lbl) {
      // A grain label is the page's one piece of emphasis, so it gets a
      // chip to sit in rather than floating over the line it names.
      const route = e.kind === 'grain';
      let chip = null;
      if (route) {
        const w = textWidth(lbl) + 12;
        chip = el('rect', { x: mid.x - w / 2, y: mid.y - 10, width: w, height: 15, rx: 7.5 }, 'chip-bg');
        labelLayer.appendChild(chip);
      }
      const t = el('text', { x: mid.x, y: mid.y, 'text-anchor': 'middle' }, `elabel${route ? ' route' : ''}`);
      t.textContent = lbl; labelLayer.appendChild(t); drawn.labelEls.push({ e, t, chip });
    }
  });
  root.appendChild(edgeLayer); root.appendChild(nodeLayer); root.appendChild(labelLayer);
  fit();
  restyle();
}

// ---- emphasis --------------------------------------------------------------
function neighbourhood(id) {
  const s = new Set([id]);
  (outOf.get(id) || []).forEach(e => s.add(e.target));
  (inOf.get(id) || []).forEach(e => s.add(e.source));
  return s;
}
function restyle() {
  const focus = hovered || selected;
  const keep = focus ? neighbourhood(focus) : null;
  const q = filter.trim().toLowerCase();
  drawn.nodeEls.forEach((g, id) => {
    const n = nodes.get(id);
    const hit = q && (displayName(n).toLowerCase().includes(q) || n.name.toLowerCase().includes(q));
    g.classList.toggle('hit', !!hit);
    g.classList.toggle('sel', id === selected);
    g.classList.toggle('dim', keep ? !keep.has(id) : (q ? !hit : false));
  });
  drawn.edgeEls.forEach(({ e, path }) => {
    const on = keep ? (e.source === focus || e.target === focus) : true;
    path.classList.toggle('dim', !on);
    path.classList.toggle('sel', keep ? on : false);
  });
  drawn.labelEls.forEach(({ e, t, chip }) => {
    const off = keep ? !(e.source === focus || e.target === focus) : false;
    t.classList.toggle('dim', off);
    if (chip) chip.classList.toggle('dim', off);
  });
}

// ---- detail panel ----------------------------------------------------------
const pre = v => `<pre>${esc(typeof v === 'string' ? v : JSON.stringify(v, null, 2))}</pre>`;
function kv(obj, skip = []) {
  const rows = [];
  for (const [k, v] of Object.entries(obj)) {
    if (skip.includes(k) || v === null || v === undefined) continue;
    if (Array.isArray(v) && v.length === 0) continue;
    if (typeof v === 'object') continue;
    rows.push(`<dt>${esc(tr(k))}</dt><dd>${esc(v)}</dd>`);
  }
  return rows.length ? `<dl>${rows.join('')}</dl>` : '';
}
function table(rows, cols) {
  if (!rows || !rows.length) return '';
  return `<table><tr>${cols.map(c => `<th>${esc(tr(c))}</th>`).join('')}</tr>` +
    rows.map(r => `<tr>${cols.map(c => `<td>${esc(Array.isArray(r[c]) ? r[c].join(', ') : (r[c] ?? ''))}</td>`).join('')}</tr>`).join('') + '</table>';
}
function edgeLine(e, other, dir) {
  const o = nodes.get(other);
  const lbl = edgeLabel(e, 'panel');
  return `<a class="edge" href="#" data-goto="${esc(other)}">${dir} <b>${esc(tr(e.kind))}</b> ${esc(o ? displayName(o) : other)}${lbl ? ' <b>' + esc(lbl) + '</b>' : ''}</a>`;
}
function renderDetail(id) {
  const n = nodes.get(id);
  const box = document.getElementById('detail');
  if (!n) { box.innerHTML = `<p class="empty">${tr('No such node.')}</p>`; return; }
  const kindText = {
    physical_table: 'Physical table', dataset: 'Dataset', entity: 'Concept',
    metric_atomic: 'Atomic metric', metric_derived: 'Derived metric',
  }[n.kind] || n.kind;
  const mappingText = { table: 'on its own table', denormalized: 'denormalized onto another table', unmapped: 'not mapped to any column' };
  let h = `<h2>${esc(displayName(n))}</h2><div class="kind">${esc(tr(kindText))}` +
    `${n.mapping ? ', ' + esc(tr(mappingText[n.mapping] || n.mapping)) : ''} — <code>${esc(n.id)}</code></div>`;
  if (n.concept) {
    const c = n.concept;
    h += `<dl><dt>${tr('model name')}</dt><dd>${esc(n.name)}</dd>` +
      `<dt>${tr('measure')}</dt><dd>${esc(c.measure)}</dd>` +
      (c.group_by ? `<dt>${tr('grain')}</dt><dd>${esc(c.group_by)}</dd>` : '') +
      ((c.via || []).length ? `<dt>${tr('via')}</dt><dd>${esc(c.via.join(' › '))}</dd>` : '') +
      `</dl>`;
  }
  if (n.badges && n.badges.length) h += '<p>' + n.badges.map(b => `<span class="badge ${b.tone}">${esc(b.text)}</span>`).join('') + '</p>';
  if (n.side === 'ont') {
    h += kv(n, ['id', 'kind', 'name', 'label', 'properties', 'unmapped', 'side', 'layer']);
    if (n.identity && n.identity.length) h += `<dl><dt>${tr('identity')}</dt><dd>${esc(n.identity.join(', '))}</dd></dl>`;
    if (n.key_columns && n.key_columns.length) h += `<dl><dt>${tr('key columns')}</dt><dd>${esc(n.key_columns.join(', '))}</dd></dl>`;
    h += `<h3>${tr('Properties')}</h3>` + table(n.properties.map(p => ({ ...p, domain: p.domain || [] })), ['name', 'concept', 'field', 'domain']);
    if (n.unmapped && n.unmapped.length) h += `<h3>${tr('Unmapped')}</h3>` + pre(n.unmapped.join('\n'));
  } else {
    const d = n.detail || {};
    if (n.kind === 'dataset') {
      h += kv(d, ['fields', 'source_sql_pretty', 'source']);
      h += `<h3>${tr('Source')}</h3>${pre(d.source_sql_pretty || d.source)}`;
      h += `<h3>${tr('Fields')}</h3>` + table(d.fields, ['name', 'label', 'expr_sql', 'physical_columns']);
    } else if (n.kind === 'physical_table') {
      h += kv(d);
      h += `<dl><dt>${tr('datasets')}</dt><dd>${esc((d.datasets || []).join(', '))}</dd></dl>`;
    } else {
      h += kv(d, ['expression', 'semantics', 'window', 'derive', 'params', 'dimensions']);
      h += `<h3>${tr('Expression')}</h3>${pre(d.expression)}`;
      ['datasets', 'physical_columns'].forEach(k => { if (d[k] && d[k].length) h += `<h3>${tr(k)}</h3>${pre(d[k].join('\n'))}`; });
      // `dimensions` is the recommendation, so an empty list is an answer
      // ("nothing here is worth grouping by"), not a missing section.
      h += `<h3>${tr('Dimensions')}</h3>` + ((d.dimensions || []).length
        ? `<div class="chips">${d.dimensions.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>`
        : `<p class="empty">${tr('Nothing recommended. Keys, foreign keys and aggregated columns are left out; any of them still works in an explicit group-by.')}</p>`);
      if (d.semantics) h += `<h3>${tr('Semantics')}</h3>` + kv(d.semantics);
      if (d.window) h += `<h3>${tr('Window')}</h3>` + pre(d.window);
      if (d.derive) h += `<h3>${tr('Derive')}</h3>` + pre(d.derive);
      if (d.params) h += `<h3>${tr('Params')}</h3>` + pre(d.params);
    }
  }
  if (n.custom_extensions && n.custom_extensions.length) h += `<h3>${tr('Extensions')}</h3>` + pre(n.custom_extensions);
  const ins = inOf.get(id) || [], outs = outOf.get(id) || [];
  h += `<h3>${tr('Edges')} (${ins.length} ${tr('in')} · ${outs.length} ${tr('out')})</h3>`;
  h += ins.map(e => edgeLine(e, e.source, '←')).join('') + outs.map(e => edgeLine(e, e.target, '→')).join('');
  if (!ins.length && !outs.length) h += `<p class="empty">${tr('none')}</p>`;
  box.innerHTML = h;
  box.querySelectorAll('[data-goto]').forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); select(a.dataset.goto); }));
}
function select(id) {
  selected = id;
  const n = nodes.get(id);
  // Clicking through to a node the current view does not draw switches
  // views — a concept from the lineage view, a dataset from the concept
  // view — so the click-through in the panel always lands somewhere.
  if (n && !drawn.nodeEls.has(id)) { view = n.side === 'ont' && view === 'lineage' ? 'lineage' : (n.side === 'v2' ? 'lineage' : view); setTab(); draw(); }
  renderDetail(id);
  restyle();
  const b = drawn.xy.get(id);
  if (b) centerOn(b);
}

// ---- pan / zoom ---------------------------------------------------------------
let vb = { x: 0, y: 0, w: 1000, h: 700 };
function applyVb() { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function bounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  drawn.xy.forEach(b => { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); });
  if (x0 === Infinity) return { x: 0, y: 0, w: 100, h: 100 };
  return { x: x0 - 80, y: y0 - 40, w: x1 - x0 + 160, h: y1 - y0 + 80 };
}
function fit() {
  const b = bounds(), r = stage.getBoundingClientRect();
  const ar = r.width / Math.max(1, r.height);
  let w = b.w, h = b.h;
  if (w / h > ar) h = w / ar; else w = h * ar;
  // Never magnify: a two-table model should sit at its natural size in a
  // corner of the canvas rather than be blown up to fill it.
  if (w < r.width) { w = r.width; h = w / ar; }
  vb = { x: b.x - (w - b.w) / 2, y: b.y - (h - b.h) / 2, w, h };
  applyVb();
}
function centerOn(b) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  if (cx < vb.x || cx > vb.x + vb.w || cy < vb.y || cy > vb.y + vb.h) { vb.x = cx - vb.w / 2; vb.y = cy - vb.h / 2; applyVb(); }
}
stage.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  const px = vb.x + (ev.clientX - r.left) / r.width * vb.w, py = vb.y + (ev.clientY - r.top) / r.height * vb.h;
  const k = ev.deltaY > 0 ? 1.12 : 1 / 1.12;
  vb = { x: px - (px - vb.x) * k, y: py - (py - vb.y) * k, w: vb.w * k, h: vb.h * k };
  applyVb();
}, { passive: false });
let drag = null;
stage.addEventListener('mousedown', ev => { drag = { x: ev.clientX, y: ev.clientY, vx: vb.x, vy: vb.y }; stage.classList.add('drag'); });
window.addEventListener('mousemove', ev => {
  if (!drag) return;
  const r = stage.getBoundingClientRect();
  vb.x = drag.vx - (ev.clientX - drag.x) / r.width * vb.w; vb.y = drag.vy - (ev.clientY - drag.y) / r.height * vb.h; applyVb();
});
window.addEventListener('mouseup', () => { drag = null; stage.classList.remove('drag'); });
svg.addEventListener('click', ev => { if (ev.target === svg || ev.target === root) { selected = null; restyle(); } });
window.addEventListener('resize', fit);

// ---- tabs / filter ---------------------------------------------------------------
function setTab() { document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === view)); }
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { view = b.dataset.view; setTab(); draw(); if (selected) restyle(); }));
document.getElementById('filter').addEventListener('input', ev => { filter = ev.target.value; restyle(); });
function changeLanguage(code) {
  language = code;
  try { localStorage.setItem('fitness_lineage_language', code); } catch (_) {}
  renderHeader();
  draw();
  if (selected) renderDetail(selected);
  else document.getElementById('detail').innerHTML = `<p class="empty">${tr('empty')}</p>`;
}
document.getElementById('language-en').addEventListener('click', () => changeLanguage('en'));
document.getElementById('language-zh').addEventListener('click', () => changeLanguage('zh'));
document.getElementById('detail').innerHTML = `<p class="empty">${tr('empty')}</p>`;

draw();
})();
</script>
</body>
</html>
