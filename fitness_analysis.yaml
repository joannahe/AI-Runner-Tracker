version: 0.2.0.dev0
name: fitness_analysis
description: Synthetic running and fitness analytics example. No real athlete data is included.
ai_context:
  instructions: Use only fictional demo athletes. Deduplicate workout copies; separate measured and rule-reference
    pace, official and watch time, and team and individual outcomes. Do not expose names, exact birth dates, or
    body measurements.
datasets:
- description: Fictional athlete identifier, recorded gender, and time zone. No names or birth dates are required.
  fields:
  - expression:
      dialects:
      - dialect: DUCKDB
        expression: athlete_id
    label: Athlete id
    name: athlete_id
  - expression:
      dialects:
      - dialect: DUCKDB
        expression: gender_code
    label: Gender code
    name: gender_code
  - expression:
      dialects:
      - dialect: DUCKDB
        expression: timezone_name
    label: Timezone name
    name: timezone_name
  name: athlete
